name: fusionweb-remote-worker
services:
  fusionweb-worker:
    image: ${FUSIONWEB_IMAGE_PREFIX:-registry.cn-hangzhou.aliyuncs.com/your-acr-namespace/fusionweb}-worker:${FUSIONWEB_VERSION:-0.1.0}
    restart: unless-stopped
    environment:
      FUSIONWEB_SERVER: ${FUSIONWEB_SERVER:-https://host.docker.internal:${FUSIONWEB_HTTPS_PORT:-8988}}
      FUSIONWEB_KEY: ${FUSIONWEB_KEY:-${FUSIONWEB_WORKER_KEY:-change-me-worker-key}}
      FUSIONWEB_NAME: ${FUSIONWEB_NAME:-remote-worker}
      FUSIONWEB_CONCURRENCY: ${FUSIONWEB_CONCURRENCY:-5}
      FUSIONWEB_INSECURE_TLS: ${FUSIONWEB_INSECURE_TLS:-true}
      FUSIONWEB_PG_DSN: ${FUSIONWEB_PG_DSN:-postgres://${POSTGRES_USER:-fusionweb}:${POSTGRES_PASSWORD:-change-me-postgres}@host.docker.internal:${FUSIONWEB_PG_PORT:-5432}/${POSTGRES_DB:-fusionweb}?sslmode=disable}
      FUSIONWEB_REDIS_ADDR: ${FUSIONWEB_REDIS_ADDR:-host.docker.internal:${FUSIONWEB_REDIS_PORT:-6379}}
      FUSIONWEB_REDIS_PASSWORD: ${FUSIONWEB_REDIS_PASSWORD:-}
      FUSIONWEB_REDIS_DB: ${FUSIONWEB_REDIS_DB:-0}
      FUSIONWEB_REDIS_PREFIX: ${FUSIONWEB_REDIS_PREFIX:-fusionweb}
      FUSIONWEB_MINIO_ENDPOINT: ${FUSIONWEB_MINIO_ENDPOINT:-host.docker.internal:${FUSIONWEB_MINIO_PORT:-9000}}
      FUSIONWEB_MINIO_ACCESS_KEY: ${FUSIONWEB_MINIO_ACCESS_KEY:-fusionweb}
      FUSIONWEB_MINIO_SECRET_KEY: ${FUSIONWEB_MINIO_SECRET_KEY:-change-me-minio-secret}
      FUSIONWEB_MINIO_BUCKET: ${FUSIONWEB_MINIO_BUCKET:-fusionweb}
      FUSIONWEB_MINIO_REGION: ${FUSIONWEB_MINIO_REGION:-us-east-1}
      FUSIONWEB_MINIO_USE_SSL: ${FUSIONWEB_MINIO_USE_SSL:-false}
      FUSIONWEB_DATA_DIR: /app/data
    volumes:
      - fusionweb_worker_data:/app/data
volumes:
  fusionweb_worker_data:

