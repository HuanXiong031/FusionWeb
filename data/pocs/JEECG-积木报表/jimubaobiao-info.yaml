id: jimubaobiao-jmreport-loadTableData-info

info:
  name: jimubaobiao-jmreport-loadTableData-info
  author: M9
  severity: critical
  tags: JeecgBoot, jmreport, loadTableData, RCE, CVE-2023-41544

http:
