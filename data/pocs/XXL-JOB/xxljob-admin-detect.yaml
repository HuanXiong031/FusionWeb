id: xxljob-admin-detect
info:
  name: XXLJOB Admin Login
  author: HuanXiong
  severity: info
  tags: tech,xxljob
http:
  - payloads:
      username:
        - admin
        - ruoyi
        - root
        - druid
      password:
        - admin
        - 123456
        - druid
        - ruoyi
        - admin123
        - admin888
        - druid
        - 12345
    attack: clusterbomb

    threads: 100
    raw:
      - |
        GET /xxl-job-admin/toLogin HTTP/1.1
        Host: {{Subdomains}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; rv:68.0) Gecko/20100101 Firefox/68.0
        Accept-Encoding: gzip, deflate
        Accept: */*
    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<a><b>XXL</b>JOB</a>"
      - type: status
        status:
          - 200