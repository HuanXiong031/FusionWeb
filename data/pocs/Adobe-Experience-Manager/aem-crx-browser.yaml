id: aem-crx-browser

info:
  name: Adobe AEM CRX Browser Exposure
  author: HuanXiong
  severity: high

  tags: Information Disclosure

http:
  - method: GET
    path:
      - "{{BaseURL}}/crx/explorer/browser/index.jsp"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Content Explorer - UserID: anonymous | Workspace: crx.default</title>'

      - type: word
        part: header
        words:
          - text/html

      - type: status
        status:
          - 200

