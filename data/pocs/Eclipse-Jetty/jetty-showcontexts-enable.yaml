id: jetty-showcontexts-enable

info:
  name: Jetty showContexts Enable in DefaultHandler
  author: HuanXiong
  severity: low

  tags: Information Disclosure

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Contexts known to this server are:"
      - type: status
        status:
          - 404

