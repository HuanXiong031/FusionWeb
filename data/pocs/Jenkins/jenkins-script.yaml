id: jenkins-script

info:
  name: Jenkins - Remote Code Execution
  author: HuanXiong
  severity: critical

  tags: RCE

http:
  - method: GET
    path:
      - "{{BaseURL}}/script/"
      - "{{BaseURL}}/jenkins/script"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "println(Jenkins.instance.pluginManager.plugins)"
      - type: word
        part: body
        words:
          - "Script Console"
          - "Scriptconsole"
        condition: or
      - type: status
        status:
          - 200
