id: tikiwiki-cms

info:
  name: Tiki Wiki CMS Groupware Login Panel - Detect
  author: HuanXiong
  severity: info

  tags: Information Disclosure

http:
  - method: GET
    path:
      - "{{BaseURL}}/tiki-login_scr.php"
      - "{{BaseURL}}/tiki-login.php"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "Tiki Wiki CMS Groupware"
        part: body

