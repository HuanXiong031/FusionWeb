id: zabbix-server-login

info:
  name: Zabbix Login Panel - Detect
  author: HuanXiong
  severity: info

  tags: Information Disclosure

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>zabbix-server: Zabbix</title>"

      - type: status
        status:
          - 200
