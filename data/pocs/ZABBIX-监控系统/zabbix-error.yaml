id: zabbix-error

info:
  name: Zabbix Panel - Detect
  author: HuanXiong
  severity: info

  tags: Information Disclosure

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Warning [refreshed every 30 sec.]</title>'

      - type: status
        status:
          - 200

