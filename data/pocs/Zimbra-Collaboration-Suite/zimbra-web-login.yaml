id: zimbra-web-login

info:
  name: Zimbra Collaboration Suite Login Panel - Detect
  author: HuanXiong
  severity: info

  tags: Information Disclosure

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Zimbra Collaboration Suite Log In"
          - "Zimbra Web Client Sign In"
          - "Zimbra Web Client Log In"
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'v=([0-9]+)'

