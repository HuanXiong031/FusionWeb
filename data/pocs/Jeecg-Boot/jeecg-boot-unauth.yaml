id: jeecg-boot-unauth

info:
  name: Jeecg Boot Unauth
  author: HuanXiong
  severity: high
  description: |-
    Jeecg Boot 未授权访问

  tags: Unauthorized

http:
  - raw:
      - |
        GET /jeecg-boot/ HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "Swagger-Bootstrap-UI"
        part: body