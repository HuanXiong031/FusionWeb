map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# ── FusionWeb 控制台（http） ───────────────────────────────────────────
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location / {
        auth_basic __FUSIONWEB_BASIC_AUTH__;
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        auth_basic off;
        proxy_pass http://fusionweb-api:8082;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /ws {
        auth_basic off;
        proxy_pass http://fusionweb-api:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 86400s;
    }

    location /static/ {
        auth_basic off;
        proxy_pass http://fusionweb-api:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
}

# ── DeepSeek Harness（DSH）入口 ────────────────────────────────────────
# 复刻 1Panel 官方 deepseek-harness 应用的做法：
#   * DSH 本体只绑容器内回环，由本反代对外提供访问；
#   * 访问先过 FusionWeb 的 Basic Auth（复用同一套账号）；
#   * 对“设置/凭据”等特权接口把 Host 改写成回环并去掉 Origin，使其穿过 DSH 的 loopback 闸门；
#   * 注入 /dsh-deployment.js（globalThis.__DSH_AUTHENTICATED_SETTINGS__ = true），让设置页远程可用。
server {
    listen 8990;
    server_name _;

    auth_basic __FUSIONWEB_BASIC_AUTH__;
    auth_basic_user_file /etc/nginx/.htpasswd;

    location = /dsh-deployment.js {
        default_type "application/javascript; charset=utf-8";
        add_header Cache-Control "no-store";
        return 200 'globalThis.__DSH_AUTHENTICATED_SETTINGS__ = true;';
    }

    # 特权接口：跨站 Origin 直接拒绝；其余改写 Host/Origin 后放行
    location ~ ^/api/(settings\.|credentials\.|llm\.discoverModels) {
        set $dsh_origin_bad 0;
        if ($http_origin != "") { set $dsh_origin_bad 1; }
        if ($http_origin = "http://$http_host") { set $dsh_origin_bad 0; }
        if ($http_origin = "https://$http_host") { set $dsh_origin_bad 0; }
        if ($dsh_origin_bad = 1) { return 403; }

        proxy_pass http://fusionweb-dsh:8990;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8991;
        proxy_set_header Origin "";
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://fusionweb-dsh:8990;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        # 关闭上游压缩，保证 sub_filter 能注入脚本
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_read_timeout 86400s;
        sub_filter '</head>' '<script src="/dsh-deployment.js"></script></head>';
        sub_filter_once on;
    }
}
