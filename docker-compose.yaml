name: fusionweb

services:
  postgres:
    image: ${FUSIONWEB_IMAGE_PREFIX:?请设置 FUSIONWEB_IMAGE_PREFIX}-postgres:17-alpine
    container_name: fusionweb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fusionweb}
      POSTGRES_USER: ${POSTGRES_USER:-fusionweb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fusionweb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fusionweb} -d ${POSTGRES_DB:-fusionweb}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [fusionweb]

  redis:
    image: ${FUSIONWEB_IMAGE_PREFIX:?请设置 FUSIONWEB_IMAGE_PREFIX}-redis:7.4-alpine
    container_name: fusionweb_redis
    restart: unless-stopped
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$FUSIONWEB_REDIS_PASSWORD"']
    environment:
      FUSIONWEB_REDIS_PASSWORD: ${FUSIONWEB_REDIS_PASSWORD:-fusionweb}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$FUSIONWEB_REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [fusionweb]

  minio:
    image: ${FUSIONWEB_IMAGE_PREFIX:?请设置 FUSIONWEB_IMAGE_PREFIX}-minio:RELEASE.2025-07-23T15-54-02Z
    container_name: fusionweb_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${FUSIONWEB_MINIO_ACCESS_KEY:-fusionweb}
      MINIO_ROOT_PASSWORD: ${FUSIONWEB_MINIO_SECRET_KEY:-fusionweb-minio-secret}
      MC_HOST_local: http://${FUSIONWEB_MINIO_ACCESS_KEY:-fusionweb}:${FUSIONWEB_MINIO_SECRET_KEY:-fusionweb-minio-secret}@localhost:9000
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [fusionweb]

  fusionweb-api:
    image: ${FUSIONWEB_IMAGE_PREFIX:?请设置 FUSIONWEB_IMAGE_PREFIX}-api:${FUSIONWEB_VERSION:-latest}
    container_name: fusionweb_api
    restart: unless-stopped
    environment:
      FUSIONWEB_PORT: 8082
      FUSIONWEB_TITLE: ${FUSIONWEB_TITLE:-FusionWeb}
      FUSIONWEB_BASIC_AUTH: ${FUSIONWEB_BASIC_AUTH:-true}
      FUSIONWEB_BASIC_USER: ${FUSIONWEB_BASIC_USER:-admin}
      FUSIONWEB_BASIC_PASS: ${FUSIONWEB_BASIC_PASS:-}
      FUSIONWEB_JWT_SECRET: ${FUSIONWEB_JWT_SECRET:-}
      FUSIONWEB_ENCRYPTION_KEY: ${FUSIONWEB_ENCRYPTION_KEY:-}
      FUSIONWEB_PUBLIC_URL: ${FUSIONWEB_PUBLIC_URL:-}
      FUSIONWEB_PG_DSN: postgres://${POSTGRES_USER:-fusionweb}:${POSTGRES_PASSWORD:-fusionweb}@postgres:5432/${POSTGRES_DB:-fusionweb}?sslmode=disable
      FUSIONWEB_PG_MAX_OPEN: ${FUSIONWEB_PG_MAX_OPEN:-50}
      FUSIONWEB_PG_MAX_IDLE: ${FUSIONWEB_PG_MAX_IDLE:-10}
      FUSIONWEB_REDIS_ADDR: redis:6379
      FUSIONWEB_REDIS_PASSWORD: ${FUSIONWEB_REDIS_PASSWORD:-fusionweb}
      FUSIONWEB_REDIS_DB: ${FUSIONWEB_REDIS_DB:-0}
      FUSIONWEB_REDIS_PREFIX: ${FUSIONWEB_REDIS_PREFIX:-fusionweb}
      FUSIONWEB_MINIO_ENDPOINT: http://minio:9000
      FUSIONWEB_MINIO_ACCESS_KEY: ${FUSIONWEB_MINIO_ACCESS_KEY:-fusionweb}
      FUSIONWEB_MINIO_SECRET_KEY: ${FUSIONWEB_MINIO_SECRET_KEY:-fusionweb-minio-secret}
      FUSIONWEB_MINIO_BUCKET: ${FUSIONWEB_MINIO_BUCKET:-fusionweb}
      FUSIONWEB_MINIO_REGION: ${FUSIONWEB_MINIO_REGION:-us-east-1}
      FUSIONWEB_MINIO_USE_SSL: "false"
      FUSIONWEB_MINIO_PUBLIC_URL: ${FUSIONWEB_MINIO_PUBLIC_URL:-}
      FUSIONWEB_PUBLIC_URL: ${FUSIONWEB_PUBLIC_URL:-}
      FUSIONWEB_WORKER_KEY: ${FUSIONWEB_WORKER_KEY:-fusionweb-worker-key}
      FUSIONWEB_WORKER_IMAGE: ${FUSIONWEB_IMAGE_PREFIX:?请设置 FUSIONWEB_IMAGE_PREFIX}-worker:${FUSIONWEB_VERSION:-latest}
      FUSIONWEB_WORKER_EXTERNAL_PG_DSN: ${FUSIONWEB_WORKER_EXTERNAL_PG_DSN:-}
      FUSIONWEB_WORKER_EXTERNAL_REDIS_ADDR: ${FUSIONWEB_WORKER_EXTERNAL_REDIS_ADDR:-}
      FUSIONWEB_WORKER_EXTERNAL_MINIO_ENDPOINT: ${FUSIONWEB_WORKER_EXTERNAL_MINIO_ENDPOINT:-}
      FUSIONWEB_LOCAL_CONSUMER: "false"
      FUSIONWEB_DATA_DIR: /app/data
      FUSIONWEB_SECRETS_DIR: /run/fusionweb-secrets
    volumes:
      - fusionweb_data:/app/data
      - fusionweb_secrets:/run/fusionweb-secrets
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [fusionweb]

  fusionweb-web:
    image: ${FUSIONWEB_IMAGE_PREFIX:?请设置 FUSIONWEB_IMAGE_PREFIX}-web:${FUSIONWEB_VERSION:-latest}
    container_name: fusionweb_web
    restart: unless-stopped
    environment:
      FUSIONWEB_BASIC_AUTH: ${FUSIONWEB_BASIC_AUTH:-true}
      FUSIONWEB_BASIC_USER: ${FUSIONWEB_BASIC_USER:-admin}
      FUSIONWEB_BASIC_PASS: ${FUSIONWEB_BASIC_PASS:-}
      FUSIONWEB_SECRETS_DIR: /run/fusionweb-secrets
      FUSIONWEB_HTTPS_PORT: ${FUSIONWEB_HTTPS_PORT:-8988}
    ports:
      - "${FUSIONWEB_HTTP_PORT:-8756}:80"
      - "${FUSIONWEB_HTTPS_PORT:-8988}:443"
    volumes:
      - fusionweb_secrets:/run/fusionweb-secrets:ro
      - fusionweb_ssl:/etc/nginx/ssl
    depends_on:
      fusionweb-api: { condition: service_healthy }
    networks: [fusionweb]

  fusionweb-worker:
    image: ${FUSIONWEB_IMAGE_PREFIX:?请设置 FUSIONWEB_IMAGE_PREFIX}-worker:${FUSIONWEB_VERSION:-latest}
    container_name: fusionweb_worker
    restart: unless-stopped
    environment:
      FUSIONWEB_SERVER: http://fusionweb-api:8082
      FUSIONWEB_KEY: ${FUSIONWEB_WORKER_KEY:-fusionweb-worker-key}
      FUSIONWEB_NAME: ${FUSIONWEB_WORKER_NAME:-default-worker}
      FUSIONWEB_CONCURRENCY: ${FUSIONWEB_WORKER_CONCURRENCY:-5}
      FUSIONWEB_ENCRYPTION_KEY: ${FUSIONWEB_ENCRYPTION_KEY:-}
      FUSIONWEB_PG_DSN: postgres://${POSTGRES_USER:-fusionweb}:${POSTGRES_PASSWORD:-fusionweb}@postgres:5432/${POSTGRES_DB:-fusionweb}?sslmode=disable
      FUSIONWEB_REDIS_ADDR: redis:6379
      FUSIONWEB_REDIS_PASSWORD: ${FUSIONWEB_REDIS_PASSWORD:-fusionweb}
      FUSIONWEB_REDIS_DB: ${FUSIONWEB_REDIS_DB:-0}
      FUSIONWEB_REDIS_PREFIX: ${FUSIONWEB_REDIS_PREFIX:-fusionweb}
      FUSIONWEB_MINIO_ENDPOINT: http://minio:9000
      FUSIONWEB_MINIO_ACCESS_KEY: ${FUSIONWEB_MINIO_ACCESS_KEY:-fusionweb}
      FUSIONWEB_MINIO_SECRET_KEY: ${FUSIONWEB_MINIO_SECRET_KEY:-fusionweb-minio-secret}
      FUSIONWEB_MINIO_BUCKET: ${FUSIONWEB_MINIO_BUCKET:-fusionweb}
      FUSIONWEB_MINIO_REGION: ${FUSIONWEB_MINIO_REGION:-us-east-1}
      FUSIONWEB_MINIO_USE_SSL: "false"
      FUSIONWEB_DATA_DIR: /app/data
    volumes:
      - fusionweb_data:/app/data
    depends_on:
      fusionweb-api: { condition: service_healthy }
    networks: [fusionweb]

networks:
  fusionweb:
    driver: bridge
volumes:
  postgres_data:
  redis_data:
  minio_data:
  fusionweb_data:
  fusionweb_secrets:
  fusionweb_ssl:





